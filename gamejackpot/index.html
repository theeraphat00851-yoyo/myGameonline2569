function wireControlPanel(){
  const fab = document.getElementById('cpFab');
  const drawer = document.getElementById('cpDrawer');
  if(fab) fab.onclick = ()=>{ window.__cpOpen = !window.__cpOpen; mountHostControlPanel(); };
  const closeBtn = document.getElementById('cpCloseBtn');
  if(closeBtn) closeBtn.onclick = ()=>{ window.__cpOpen = false; mountHostControlPanel(); };
  document.querySelectorAll('.cp-tab').forEach(el=>{
    el.onclick = ()=>{ window.__cpTab = el.dataset.tab; mountHostControlPanel(); };
  });

  // players tab
  document.querySelectorAll('[data-act="score-"]').forEach(el=> el.onclick = ()=> adjustScore(el.dataset.id, -10));
  document.querySelectorAll('[data-act="score+"]').forEach(el=> el.onclick = ()=> adjustScore(el.dataset.id, 10));
  document.querySelectorAll('[data-act="kick"]').forEach(el=> el.onclick = ()=>{ if(confirm('เชิญผู้เล่นคนนี้ออกจากเกม?')) kickPlayer(el.dataset.id); });
  document.querySelectorAll('[data-role="score-input"]').forEach(el=>{
    el.onkeydown = (e)=>{ if(e.key==='Enter'){ setScore(el.dataset.id, el.value); toast('อัปเดตคะแนนแล้ว'); } };
  });

  // game tab
  const autoSw = document.getElementById('cpAutoSwitch'); if(autoSw) autoSw.onclick = toggleAutoMode;
  const speedSw = document.getElementById('cpSpeedSwitch'); if(speedSw) speedSw.onclick = ()=>{
    const cur = !!GAME.meta.speedRoundNext;
    gref('meta/speedRoundNext').set(!cur);
    toast(!cur? '⚡ ข้อถัดไปจะเป็น Speed Round':'ยกเลิก Speed Round ข้อถัดไปแล้ว');
  };
  const speedSetBtn = document.getElementById('cpSpeedSetBtn'); if(speedSetBtn) speedSetBtn.onclick = ()=>{
    const mult = Number(document.getElementById('cpSpeedMultInput').value);
    const pct = Number(document.getElementById('cpSpeedTimeInput').value);
    if(isNaN(mult) || mult<1 || mult>5 || isNaN(pct) || pct<10 || pct>100){ toast('กรุณาใส่ค่าที่ถูกต้อง (คูณ 1-5, เวลา 10-100%)'); return; }
    gref('meta').update({ speedMult: Math.round(mult*10)/10, speedTimeFactor: Math.round(pct)/100 });
    toast('ตั้งค่า Speed Round แล้ว');
  };
  const streakSetBtn = document.getElementById('cpStreakSetBtn'); if(streakSetBtn) streakSetBtn.onclick = ()=>{
    const step = Number(document.getElementById('cpStreakStepInput').value);
    const cap = Number(document.getElementById('cpStreakCapInput').value);
    if(isNaN(step) || step<0 || step>100 || isNaN(cap) || cap<1 || cap>10){ toast('กรุณาใส่ค่าที่ถูกต้อง'); return; }
    gref('meta').update({ streakStep: Math.round(step)/100, streakCapSteps: Math.round(cap) });
    toast('ตั้งค่าตัวคูณสตรีคแล้ว');
  };
  const donSetBtn = document.getElementById('cpDonSetBtn'); if(donSetBtn) donSetBtn.onclick = ()=>{
    const p1 = Math.max(0, Math.round(Number(document.getElementById('cpDonP1Input').value)||0));
    const p2 = Math.max(0, Math.round(Number(document.getElementById('cpDonP2Input').value)||0));
    gref('meta').update({ donPreset1: p1, donPreset2: p2 });
    toast('ตั้งค่า Double or Nothing แล้ว');
  };
  const pb = document.getElementById('cpPauseBtn'); if(pb) pb.onclick = togglePause;
  document.querySelectorAll('[data-ext]').forEach(el=> el.onclick = ()=> extendTime(parseInt(el.dataset.ext)));
  const ab = document.getElementById('cpAdvanceBtn'); if(ab) ab.onclick = advancePhase;
  const rb = document.getElementById('cpRestartQBtn'); if(rb) rb.onclick = ()=>{ if(confirm('เริ่มข้อปัจจุบันใหม่? คำตอบของนักเรียนในข้อนี้จะถูกล้าง')) jumpToQuestion(GAME.meta.questionIndex); };
  const jb = document.getElementById('cpJumpBtn'); if(jb) jb.onclick = ()=>{
    const v = parseInt(document.getElementById('cpJumpInput').value);
    if(!v || v<1 || v>GAME.meta.totalQuestions){ toast('กรุณาใส่หมายเลขข้อให้ถูกต้อง'); return; }
    if(confirm(`ไปข้อที่ ${v}? คำตอบเดิมของข้อนั้น (ถ้ามี) จะถูกล้าง`)) jumpToQuestion(v-1);
  };
  const eb = document.getElementById('cpEndNowBtn'); if(eb) eb.onclick = ()=>{ if(confirm('จบเกมทันทีเลยหรือไม่?')) endGameNow(); };
  const feb = document.getElementById('cpForceEndBtn'); if(feb) feb.onclick = ()=>{
    if(confirm('🚨 บังคับจบเกมทันที? ผู้เล่นทุกคนจะถูกพาไปหน้าสรุปผลทันทีไม่ว่าตอนนี้อยู่ขั้นตอนไหน')){ clearAllAutoTimers(); endGameNow(); toast('บังคับจบเกมแล้ว'); }
  };
  const wdb = document.getElementById('cpWipeDataBtn'); if(wdb) wdb.onclick = ()=>{
    if(!confirm('⚠️ การล้างข้อมูลจะลบผู้เล่น คะแนน คำถาม และค่าที่ตั้งไว้ทั้งหมดอย่างถาวร ไม่สามารถกู้คืนได้ ต้องการดำเนินการต่อหรือไม่?')) return;
    if(!confirm('ยืนยันอีกครั้ง: ล้างข้อมูลทั้งหมดและกลับไปหน้าตั้งค่าเลยใช่ไหม?')) return;
    clearAllAutoTimers();
    gref().set(null);
    toast('ล้างข้อมูลทั้งหมดแล้ว');
  };

  // jackpot tab
  document.querySelectorAll('[data-jk]').forEach(el=> el.onclick = ()=> adjustJackpot(parseInt(el.dataset.jk)));
  const jkSet = document.getElementById('cpJkSetBtn'); if(jkSet) jkSet.onclick = ()=>{
    const v = document.getElementById('cpJkInput').value;
    if(v==='' || isNaN(v)){ toast('กรุณาใส่ตัวเลข'); return; }
    setJackpot(v); toast('ตั้งค่าแจ็คพอทแล้ว');
  };
  const wrSet = document.getElementById('cpWrongRefundSetBtn'); if(wrSet) wrSet.onclick = ()=>{
    const v = document.getElementById('cpWrongRefundInput').value;
    if(v==='' || isNaN(v) || Number(v)<0){ toast('กรุณาใส่ตัวเลข'); return; }
    gref('meta/wrongRefund').set(Math.round(Number(v)));
    toast('ตั้งค่าคะแนนคืนตู้แล้ว');
  };
  const wmSet = document.getElementById('cpWrongMultSetBtn'); if(wmSet) wmSet.onclick = ()=>{
    const v = document.getElementById('cpWrongMultInput').value;
    if(v==='' || isNaN(v) || Number(v)<0){ toast('กรุณาใส่ตัวเลข 0 ขึ้นไป'); return; }
    gref('meta/wrongSpinGoodMult').set(Math.max(0, Number(v)));
    toast('ตั้งค่าอัตราลุ้นรางวัลของคนตอบผิดแล้ว');
  };
  document.querySelectorAll('.rate-input').forEach(el=>{
    el.oninput = recalcRatePercents;
    el.onchange = ()=>{
      const v = Math.max(0, Math.round(Number(el.value)||0));
      el.value = v;
      gref('meta/outcomeWeights/'+el.dataset.key).set(v);
      recalcRatePercents();
      toast('ปรับอัตรา '+el.dataset.key+' แล้ว');
    };
  });
  const resetRatesBtn = document.getElementById('cpResetRatesBtn');
  if(resetRatesBtn) resetRatesBtn.onclick = ()=>{
    if(confirm('คืนค่าอัตราการออกรางวัลทั้งหมดกลับเป็นค่าเริ่มต้น?')){
      gref('meta/outcomeWeights').remove();
      toast('คืนค่าอัตราเริ่มต้นแล้ว');
    }
  };

  // settings tab
  const lockSw = document.getElementById('cpLockSwitch'); if(lockSw) lockSw.onclick = toggleLock;
  const reactSw = document.getElementById('cpReactSwitch'); if(reactSw) reactSw.onclick = toggleReactionsEnabled;
  const sndSw = document.getElementById('cpSndSwitch'); if(sndSw) sndSw.onclick = ()=>{
    sndOn = !sndOn;
    document.getElementById('sndToggle').textContent = sndOn ? '🔊' : '🔇';
    mountHostControlPanel();
  };
}
</script>

<script>
/* ==========================================================================
   PLAYER VIEW
   ========================================================================== */
function renderPlayer(){
  if(!GAME || !GAME.meta){
    root.innerHTML = `<div class="center-msg"><div class="ic">⏳</div>รอครูเปิดห้อง...<br><button class="btn ghost sm" style="margin-top:14px;" id="backBtn">← กลับ</button></div>`;
    document.getElementById('backBtn').onclick = ()=>{ leaveRoom(); };
    return;
  }
  if(!ME.id || !GAME.players || !GAME.players[ME.id]){
    if(GAME.meta.locked){
      root.innerHTML = `<div class="center-msg"><div class="ic">🔒</div>ครูล็อคห้องนี้แล้ว<br><span style="opacity:.7;font-size:13px;">ไม่สามารถเข้าร่วมเพิ่มได้ในขณะนี้</span><br><button class="btn ghost sm" style="margin-top:14px;" id="backBtn">← กลับ</button></div>`;
      document.getElementById('backBtn').onclick = ()=>{ leaveRoom(); };
      return;
    }
    renderPlayerJoin(); return;
  }

  const phase = GAME.meta.phase;
  if(phase === 'setup'){
    root.innerHTML = `<div class="center-msg"><div class="ic">⏳</div>รอครูตั้งค่าเกม...</div>`;
    return;
  }
  if(phase === 'lobby'){ renderPlayerLobby(); return; }
  if(phase === 'end'){ renderPlayerEnd(); return; }
  renderPlayerGame(phase);
}

function renderPlayerJoin(){
  window.__selAvatar = window.__selAvatar || AVATARS[0];
  root.innerHTML = `
    <div class="landing">
      <h1 class="marquee" style="font-size:32px;">🎰 เข้าร่วมเกม</h1>
      <div class="join-avatar-preview" id="avatarPreview">${window.__selAvatar}</div>
      <div class="field" style="max-width:300px;margin:0 auto 4px;">
        <label>ชื่อของคุณ</label>
        <input type="text" id="nameInput" placeholder="ชื่อเล่น" maxlength="16" value="${esc(ME.name||'')}" autocomplete="off">
        <div class="char-count" id="nameCount">${(ME.name||'').length}/16</div>
      </div>
      <div style="max-width:340px;margin:10px auto 0;">
        <label style="display:block;font-size:13px;opacity:.8;margin-bottom:10px;">เลือกตัวละคร</label>
        <div class="avatar-grid">
          ${AVATARS.map(a=>`<button type="button" class="avatar-opt ${a===window.__selAvatar?'sel':''}" data-a="${a}" aria-label="เลือก ${a}">${a}</button>`).join('')}
        </div>
      </div>
      <button class="btn block" id="joinBtn" style="max-width:300px;margin:20px auto 0;">🚪 เข้าร่วมห้อง</button>
      <button class="btn ghost sm" id="backBtn" style="margin-top:14px;">← กลับ</button>
    </div>
  `;
  const preview = document.getElementById('avatarPreview');
  root.querySelectorAll('.avatar-opt').forEach(el=>{
    el.onclick = ()=>{
      window.__selAvatar = el.dataset.a;
      root.querySelectorAll('.avatar-opt').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
      preview.textContent = window.__selAvatar;
      preview.classList.remove('pop'); void preview.offsetWidth; preview.classList.add('pop');
      SND.tick();
    };
  });
  const nameInput = document.getElementById('nameInput');
  const nameCount = document.getElementById('nameCount');
  nameInput.oninput = ()=>{ nameCount.textContent = nameInput.value.length + '/16'; };
  nameInput.onkeydown = (e)=>{ if(e.key==='Enter') document.getElementById('joinBtn').click(); };
  document.getElementById('backBtn').onclick = ()=>{ leaveRoom(); };
  document.getElementById('joinBtn').onclick = ()=>{
    const name = nameInput.value.trim();
    if(!name){ toast('กรุณาใส่ชื่อ'); nameInput.focus(); return; }
    ME = { id: ME.id || uid(), name, avatar: window.__selAvatar };
    saveMe();
    gref('players/'+ME.id).set({ name, avatar: ME.avatar, score:0, streak:0, joinedAt: Date.now() });
    SND.click();
  };
}

function renderPlayerLobby(){
  root.innerHTML = `
    <div class="center-msg">
      <div class="ic">${ME.avatar}</div>
      <div style="font-family:var(--disp);font-size:20px;color:var(--gold-bright);">สวัสดี ${esc(ME.name)}!</div>
      <div style="margin-top:8px;opacity:.8;">รอครูเริ่มเกม... (${Object.keys(GAME.players||{}).length} คนพร้อมแล้ว)</div>
    </div>`;
}

function renderPlayerGame(phase){
  const qi = GAME.meta.questionIndex;
  const q = GAME.questions[qi];
  const me = GAME.players[ME.id];
  const myAns = GAME.answers && GAME.answers[qi] && GAME.answers[qi][ME.id];

  if(phase === 'question'){
    myAnswerLocked = !!myAns;
    const paused = !!GAME.meta.paused;
    root.innerHTML = `
      <div class="topbar brass-frame"><span class="rivet bl"></span><span class="rivet br"></span>
        <div class="qcount">ข้อที่ ${qi+1} / ${GAME.meta.totalQuestions}</div>
        ${jackpotBadgeHTML()}
      </div>
      ${frameWrap(`<div style="padding:20px;">
        ${renderHost__timerBar()}
        ${GAME.meta.speedRound? `<div class="speed-badge">⚡ SPEED ROUND — คะแนนคูณ ${GAME.meta.speedMult ?? 2} เท่า!</div>`:''}
        <div class="qtext" style="font-size:18px;">${esc(q.q)}</div>
        <div class="choices" style="position:relative;">
          ${paused && !myAnswerLocked? `<div class="cp-overlay-pause"><span style="font-size:30px;">⏸️</span>ครูหยุดเกมชั่วคราว</div>`:''}
          ${q.choices.map((c,i)=>`<div class="choice c${i} ${(myAnswerLocked||paused)?'locked':''} ${myAns && myAns.choice===i?'wrong-sel':''}" data-i="${i}"><span class="tag">${letterOf(i)}</span><span class="choice-txt">${esc(c)}</span></div>`).join('')}
        </div>
        ${myAnswerLocked? `<div style="text-align:center;margin-top:14px;">
          <div class="avatar-waiting">${ME.avatar}</div>
          <div style="opacity:.85;margin-top:4px;">✅ ส่งคำตอบแล้ว รอเพื่อนๆ...</div>
        </div>`:''}
      </div>`)}
    `;
    clearInterval(playerTickInt);
    playerTickInt = setInterval(()=>{
      const ring = document.querySelector('.timer-ring');
      if(!ring || !GAME || !GAME.meta || GAME.meta.phase !== 'question'){ clearInterval(playerTickInt); return; }
      const left = getTimeLeft();
      const circ=2*Math.PI*32; const pct=Math.max(0,left/GAME.meta.qTime);
      ring.querySelector('.fg').style.strokeDashoffset = circ*(1-pct);
      ring.querySelector('.num').textContent = Math.max(0,Math.ceil(left));
      const urgency = pct<=0.2?'danger':(pct<=0.5?'warn':'');
      ring.classList.remove('warn','danger');
      if(urgency) ring.classList.add(urgency);
    }, 250);
    if(!myAnswerLocked && !paused){
      root.querySelectorAll('.choice').forEach(el=>{
        el.onclick = ()=>{
          if(myAnswerLocked || GAME.meta.paused) return;
          myAnswerLocked = true;
          const i = parseInt(el.dataset.i);
          gref('answers/'+qi+'/'+ME.id).set({ choice:i, ts: Date.now() - (GAME.meta.phaseStartTime||Date.now()) });
          SND.click();
          render();
        };
      });
    }
  } else if(phase === 'reveal'){
    const correct = !!myAns && myAns.choice === q.correct;
    if(lastRevealSoundQi !== qi){
      lastRevealSoundQi = qi;
      if(myAns !== undefined){
        SND[correct ? 'correct' : 'wrong']();
        screenFlash(correct ? 'good' : 'bad');
        if(correct) spawnConfetti(30);
      }
    }
    root.innerHTML = `
      <div class="center-msg">
        <div class="avatar-reveal ${myAns===undefined?'':(correct?'happy':'sad')}">${ME.avatar}</div>
        <div class="ic correct-icon-burst" style="font-size:${correct?'44px':'32px'};margin-top:2px;">${myAns===undefined? '⌛' : (correct? '🎉':'❌')}</div>
        <div class="disp" style="font-size:${correct?'26px':'22px'};color:${correct?'var(--good)':'var(--bad)'};${correct?'text-shadow:0 0 18px rgba(53,201,122,.6);':''}">
          ${myAns===undefined? 'ไม่ได้ตอบข้อนี้' : (correct? `🎊 ตอบถูก! +${me.lastGain||0} คะแนน` : 'ตอบผิด')}
        </div>
        ${correct && me.lastMult>1? `<div style="margin-top:4px;color:var(--gold-bright);font-size:13px;">✨ ตัวคูณรวม x${me.lastMult}${me.lastSpeedRound?' (⚡ Speed Round x2)':''}</div>`:''}
        <div style="margin-top:10px;opacity:.8;">คำตอบที่ถูก: ${letterOf(q.correct)}. ${esc(q.choices[q.correct])}</div>
        ${(me.streak||0)>=2? `<div style="margin-top:8px;">🔥 ตอบถูกติดต่อกัน ${me.streak} ข้อ! (คูณ x${(1+Math.min(me.streak-1,(GAME.meta.streakCapSteps ?? 4))*(GAME.meta.streakStep ?? 0.1)).toFixed(2)})</div>`:''}
      </div>`;
  } else if(phase === 'spin'){
    renderPlayerSpin(qi);
  } else if(phase === 'leaderboard'){
    const ranked = Object.entries(GAME.players).sort((a,b)=>b[1].score-a[1].score);
    const myRank = ranked.findIndex(([id])=>id===ME.id)+1;
    root.innerHTML = `
      <div style="text-align:center;font-family:var(--disp);color:var(--gold-bright);margin-bottom:14px;">📊 ตารางคะแนน — คุณอยู่อันดับ ${myRank}</div>
      ${ranked.slice(0,10).map(([id,p],i)=>`
        <div class="lb-row ${id===ME.id?'me':''}"><span class="lb-rank">${i+1}</span><span class="lb-av">${p.avatar}</span><span class="lb-name">${esc(p.name)}</span><span class="lb-score mono">${fmtNum(p.score)}</span></div>
      `).join('')}
    `;
  }
}

function renderPlayerSpin(qi){
  const spinMap = (GAME.top5 && GAME.top5[qi]) || {};
  const myTurn = Object.prototype.hasOwnProperty.call(spinMap, ME.id);
  const iAnsweredCorrect = !!spinMap[ME.id];
  const mySpin = GAME.spins && GAME.spins[qi] && GAME.spins[qi][ME.id];

  if(!myTurn){
    const reactionsOn = GAME.meta.reactionsEnabled !== false;
    const didntAnswer = !(GAME.answers && GAME.answers[qi] && GAME.answers[qi][ME.id]);
    root.innerHTML = `
      <div class="center-msg">
        <div class="ic">🎰</div>
        <div style="opacity:.85;">${didntAnswer? 'คุณไม่ได้ตอบคำถามข้อนี้ จึงไม่ได้สิทธิ์หมุนตู้แจ็คพอทรอบนี้' : 'รอผู้เล่นคนอื่นหมุนตู้แจ็คพอท...'}</div>
        ${reactionsOn? `<div class="react-row">
          ${['😀','👏','😱','😭'].map(e=>`<div class="react-btn" data-e="${e}">${e}</div>`).join('')}
        </div>` : ''}
      </div>`;
    root.querySelectorAll('.react-btn').forEach(el=>{
      el.onclick = ()=>{ gref('reactions/'+Date.now()+'_'+Math.random().toString(36).slice(2)).set({emoji:el.dataset.e, avatar: ME.avatar}); };
    });
    return;
  }

  if(mySpin){
    localSpin = null;
    const o = OUTCOMES.find(x=>x.key===mySpin.outcome);
    const finals = [o.sym, o.sym, o.sym];
    const donBet = mySpin.donBet||0;
    root.innerHTML = `
      <div class="slot-cabinet">
        <div class="slot-body brass-frame"><span class="rivet bl"></span><span class="rivet br"></span>
          <div class="slot-topper">🎰 ผลการหมุน 🎰</div>
          <div class="reels-row">
            ${finals.map(s=>`<div class="reel-window ${o.tone==='good'?'win-glow':''}"><div class="reel-strip"><div class="reel-sym">${s}</div></div></div>`).join('')}
          </div>
        </div>
        <div class="outcome-banner ${o.tone}">${o.sym} ${o.label}<br><span class="mono">${mySpin.delta>=0?'+':''}${mySpin.delta} คะแนน</span></div>
        ${donBet>0? `<div class="don-result ${mySpin.donDelta>=0?'win':'lose'}">🎲 Double or Nothing (เดิมพัน ${fmtNum(donBet)}) — ${mySpin.donDelta>=0?`ชนะ! ได้เพิ่ม +${fmtNum(mySpin.donDelta)}`:`เสียเดิมพันไป ${fmtNum(Math.abs(mySpin.donDelta))}`}</div>`:''}
      </div>`;
    return;
  }

  // still spinning locally (result already decided client-side, just animating) —
  // re-draw using the persisted per-reel "stopped" state instead of restarting it
  if(localSpin && localSpin.qi === qi){ renderSpinCabinet(localSpin.outcome, localSpin.finals, localSpin.stopped, iAnsweredCorrect); return; }

  // ---- Double or Nothing prompt: shown once per question before the reels
  // start, letting the player wager extra points on this spin. ----
  if(window.__donQi !== qi){
    renderDonPrompt(qi, iAnsweredCorrect);
    return;
  }
  const donBet = window.__donBet || 0;

  root.innerHTML = `
    <div class="slot-cabinet">
      <div class="reel-label">${iAnsweredCorrect? '🎉 คุณตอบถูก! ได้สิทธิ์หมุนตู้แจ็คพอท' : '🔻 ตอบผิด แต่ยังได้หมุนตู้แจ็คพอท (อัตราลุ้นรางวัลลดลง)'}</div>
      ${donBet>0? `<div class="don-badge">🎲 เดิมพันไว้ ${fmtNum(donBet)} แต้ม — ออกดีได้คืน x2 / ออกไม่ดีเสียหมด!</div>`:''}
      <div class="slot-body brass-frame" id="slotBody"><span class="rivet bl"></span><span class="rivet br"></span>
        <div class="slot-topper">🎰 JACKPOT SPIN 🎰</div>
        <div class="reels-row">
          <div class="reel-window" id="reelWin0"><div class="reel-strip"><div class="reel-sym">${FILLER_SYMS[0]}</div></div></div>
          <div class="reel-window" id="reelWin1"><div class="reel-strip"><div class="reel-sym">${FILLER_SYMS[1]}</div></div></div>
          <div class="reel-window" id="reelWin2"><div class="reel-strip"><div class="reel-sym">${FILLER_SYMS[2]}</div></div></div>
        </div>
      </div>
      <button class="spin-btn" id="spinBtn">หมุน<br>เลย!</button>
      <div class="reel-sub">กดหมุนภายใน 8 วินาที ไม่งั้นระบบหมุนให้อัตโนมัติ</div>
    </div>`;
  let autoTimer = setTimeout(startSpin, 8000);
  document.getElementById('spinBtn').onclick = ()=>{ clearTimeout(autoTimer); startSpin(); };

  function reelFinalSymbols(outcome){
    if(outcome.key !== 'MISS') return [outcome.sym, outcome.sym, outcome.sym];
    const pool = FILLER_SYMS.filter(s=>s!==outcome.sym);
    const a = pool[Math.floor(Math.random()*pool.length)];
    const nearMiss = Math.random() < 0.6; // "so close!" 2-of-3 match, common slot tease
    const b = nearMiss ? a : pool[Math.floor(Math.random()*pool.length)];
    let c = pool[Math.floor(Math.random()*pool.length)];
    if(nearMiss){ while(c===a) c = pool[Math.floor(Math.random()*pool.length)]; }
    return [a,b,c];
  }

  function startSpin(){
    const btn = document.getElementById('spinBtn'); if(btn) btn.disabled = true;
    const outcome = pickOutcome(!iAnsweredCorrect);
    const finals = reelFinalSymbols(outcome);
    localSpin = { qi, outcome, finals, stopped:[false,false,false] };
    SND.click();
    renderSpinCabinet(outcome, finals, localSpin.stopped, iAnsweredCorrect);

    const STOP_AT = [900, 1300, 1850]; // reel 1,2,3 stop times (ms) — staggered for suspense
    const spinBeep = setInterval(SND.spinloop, 90);
    const drone = startSpinDrone();
    riseSpinDrone(drone, Math.max(...STOP_AT));
    STOP_AT.forEach((t,i)=>{
      setTimeout(()=>{
        SND.click();
        if(localSpin) localSpin.stopped[i] = true;
        const win = document.getElementById('reelWin'+i);
        if(win){
          win.classList.remove('spinning');
          const strip = win.querySelector('.reel-strip');
          if(strip) strip.innerHTML = `<div class="reel-sym">${finals[i]}</div>`;
        }
      }, t);
    });
    setTimeout(()=>{
      clearInterval(spinBeep);
      stopSpinDrone(drone);
      applySpinResult(qi, ME.id, outcome, donBet);
      if(outcome.tone==='good'){
        SND[outcome.key==='GRAND'?'jackpot':'coin']();
        if(outcome.key==='GRAND' || outcome.key==='MINI'){ spawnCoinBurst(outcome.key==='GRAND'?36:18); spawnConfetti(outcome.key==='GRAND'?32:16); screenFlash('good'); }
        [0,1,2].forEach(i=>{ const w=document.getElementById('reelWin'+i); if(w) w.classList.add('win-glow'); });
      } else if(outcome.key==='BOMB'){
        SND.bomb();
        screenFlash('bad');
        const body = document.getElementById('slotBody');
        if(body){ body.classList.add('shake'); setTimeout(()=>body.classList.remove('shake'), 400); }
      } else {
        SND.reveal();
      }
    }, Math.max(...STOP_AT) + 150);
  }
}

// ---- Double or Nothing prompt: wager some current points before spinning.
// "Good" spin results (💎🪙⭐) pay the wager back doubled; anything else
// forfeits it. Choosing "ข้าม" (skip) plays the spin exactly as before. ----
function renderDonPrompt(qi, iAnsweredCorrect){
  const me = GAME.players[ME.id] || {score:0};
  const score = me.score || 0;
  const p1 = GAME.meta.donPreset1 ?? 50;
  const p2 = GAME.meta.donPreset2 ?? 100;
  const raw = [0, p1, p2, Math.round(score*0.5)];
  const opts = [...new Set(raw.map(v=>Math.min(v, score)))].sort((a,b)=>a-b);
  root.innerHTML = `
    <div class="slot-cabinet">
      <div class="reel-label">${iAnsweredCorrect? '🎉 คุณตอบถูก! ก่อนหมุน...' : '🔻 ตอบผิด แต่ยังหมุนได้ (อัตราลุ้นรางวัลลดลง) — ก่อนหมุน...'}</div>
      <div class="don-card brass-frame"><span class="rivet bl"></span><span class="rivet br"></span>
        <div class="don-title">🎲 Double or Nothing?</div>
        <div class="don-desc">เดิมพันคะแนนเพิ่มก่อนหมุน — ถ้าผลออก <b style="color:var(--good);">💎🪙⭐ (ดี)</b> รับเดิมพันคืน 2 เท่า แต่ถ้าออก <b style="color:var(--bad);">🦹💣🔔 (ไม่ดี)</b> เสียเดิมพันไปเลย</div>
        <div class="don-score">คะแนนปัจจุบัน: <span class="mono">${fmtNum(score)}</span></div>
        <div class="don-options">
          ${opts.map(v=>`<button class="btn ${v===0?'ghost':''} sm don-opt" data-bet="${v}">${v===0?'ข้าม (ไม่เดิมพัน)':`เดิมพัน ${fmtNum(v)}`}</button>`).join('')}
        </div>
      </div>
    </div>`;
  root.querySelectorAll('.don-opt').forEach(el=>{
    el.onclick = ()=>{
      window.__donQi = qi;
      window.__donBet = parseInt(el.dataset.bet)||0;
      SND.click();
      render();
    };
  });
}

// Renders the 3 reels; each reel independently shows either the spinning
// filler-loop or its already-decided final symbol, per the `stopped` array —
// this lets an unrelated realtime update re-draw mid-spin without visually
// un-stopping a reel that already landed.
function renderSpinCabinet(outcome, finals, stopped, iAnsweredCorrect){
  const allStopped = stopped.every(Boolean);
  root.innerHTML = `
    <div class="slot-cabinet">
      <div class="reel-label">${iAnsweredCorrect? '🎉 คุณตอบถูก! ได้สิทธิ์หมุนตู้แจ็คพอท' : '🔻 ตอบผิด แต่ยังได้หมุนตู้แจ็คพอท (อัตราลุ้นรางวัลลดลง)'}</div>
      <div class="slot-body brass-frame" id="slotBody"><span class="rivet bl"></span><span class="rivet br"></span>
        <div class="slot-topper">🎰 JACKPOT SPIN 🎰</div>
        <div class="reels-row">
          ${[0,1,2].map(i=>`
            <div class="reel-window ${stopped[i]?'':'spinning'}" id="reelWin${i}">
              <div class="reel-strip">
                ${stopped[i]
                  ? `<div class="reel-sym">${finals[i]}</div>`
                  : FILLER_SYMS.slice(0,4).map(s=>`<div class="reel-sym">${s}</div>`).join('')}
              </div>
            </div>`).join('')}
        </div>
      </div>
      <button class="spin-btn" disabled>หมุน<br>แล้ว</button>
      <div class="reel-sub">${allStopped? '⏳ กำลังบันทึกผล...' : 'กำลังหมุน...'}</div>
    </div>`;
}

function spawnCoinBurst(n){
  const wrap = document.createElement('div'); wrap.className = 'coin-burst';
  document.body.appendChild(wrap);
  for(let i=0;i<n;i++){
    const c = document.createElement('div'); c.className = 'coin-fx'; c.textContent = Math.random()<.5?'🪙':'✨';
    c.style.left = (Math.random()*100)+'%';
    c.style.animationDuration = (1.4+Math.random()*1.1)+'s';
    c.style.fontSize = (18+Math.random()*16)+'px';
    wrap.appendChild(c);
  }
  setTimeout(()=>wrap.remove(), 2700);
}

function applySpinResult(qi, pid, outcome, bet){
  bet = Math.max(0, Math.round(Number(bet)||0));
  // ใช้ transaction แทน once().then(update) เพราะถ้าผู้เล่นหลายคนใน TOP 5
  // กดหมุนพร้อมกัน การอ่านค่า jackpot/players แบบ once() จะเจอ race condition
  // (อ่านค่าเก่าเหมือนกันก่อนเขียนทับ ทำให้แต้ม/jackpot คลาดเคลื่อน)
  gref().transaction(g=>{
    if(!g) return g;
    if(g.spins && g.spins[qi] && g.spins[qi][pid]) return g; // กันกดซ้ำ/หมุนซ้ำ
    if(!g.players) g.players = {};
    if(!g.meta) g.meta = {};
    const players = g.players;
    let jackpot = g.meta.jackpot || 0;
    const startPot = g.meta.startingJackpot || jackpot || 5000;
    const potCap = Math.round(startPot*1.5);
    let delta = 0;
    if(outcome.key === 'GRAND'){
      // takes EVERYTHING left in the pot — the dramatic, game-ending spin
      delta = jackpot;
      g.meta.jackpot = 0;
    }
    else if(outcome.key === 'MINI'){
      delta = Math.min(jackpot, Math.max(50, Math.round(jackpot*0.2)));
      g.meta.jackpot = jackpot - delta;
    }
    else if(outcome.key === 'BONUS'){
      delta = Math.min(jackpot, 250);
      g.meta.jackpot = jackpot - delta;
    }
    else if(outcome.key === 'STEAL'){
      const ranked = Object.entries(players).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
      const top = ranked[0];
      if(top && top[0] !== pid && (top[1].score||0) > 0){
        delta = Math.min(150, top[1].score||0);
        players[top[0]].score = Math.max(0,(players[top[0]].score||0)-delta);
      } else { // fallback: ไม่มีใครให้ขโมย -> ดึงจากตู้แทน
        delta = Math.min(jackpot, 150);
        g.meta.jackpot = jackpot - delta;
      }
    }
    else if(outcome.key === 'BOMB'){
      delta = -120;
      g.meta.jackpot = Math.min(potCap, jackpot + 120); // ระเบิด = คะแนนที่เสียไปกลับเข้าตู้
    }
    else { delta = 0; } // MISS
    if(!players[pid]) players[pid] = { score:0 };
    const curScore = players[pid].score || 0;
    // ---- Double or Nothing: player wagered points before spinning. A "good"
    // outcome pays the wager back doubled (net +bet on top of the normal win);
    // anything else (bad/neutral) forfeits the wager entirely. ----
    let donDelta = 0;
    if(bet>0){ donDelta = outcome.tone==='good' ? bet : -bet; }
    players[pid].score = Math.max(0, curScore + delta + donDelta);
    if(!g.spins) g.spins = {};
    if(!g.spins[qi]) g.spins[qi] = {};
    g.spins[qi][pid] = { outcome: outcome.key, delta, donBet:bet, donDelta, ts: Date.now() };
    return g;
  }, (err)=>{ if(err) console.error('spin transaction error', err); });
}

function renderPlayerEnd(){
  const players = GAME.players || {};
  const ranked = Object.entries(players).sort((a,b)=>b[1].score-a[1].score);
  const myRank = ranked.findIndex(([id])=>id===ME.id)+1;
  root.innerHTML = `
    <div class="center-msg">
      <div class="ic">🏁</div>
      <div class="disp" style="font-size:22px;color:var(--gold-bright);">จบเกม!</div>
      <div style="margin-top:8px;">คุณอยู่อันดับที่ <b>${myRank}</b> จาก ${ranked.length} คน</div>
      <div style="margin-top:4px;" class="mono">คะแนนรวม ${fmtNum(players[ME.id]?.score||0)}</div>
    </div>`;
}
</script>

<script>
/* periodic cleanup of old reactions (host only, avoid db bloat) — the
   attach/detach functions themselves live earlier in the file (right next
   to attachGameListener) since autoResume() can call them on initial page
   load, before this later script block would otherwise have run. */
setInterval(()=>{
  if(ROLE !== 'host' || !ROOM || !GAME || !GAME.reactions) return;
  const keys = Object.keys(GAME.reactions);
  if(keys.length > 40){
    const updates = {};
    keys.slice(0, keys.length-40).forEach(k=> updates[k]=null);
    gref('reactions').update(updates);
  }
}, 8000);

render();
</script>
