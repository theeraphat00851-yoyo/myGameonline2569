<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Jackpot Quiz Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;800;900&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
/* ==========================================================================
   JACKPOT QUIZ ARENA — design tokens
   felt green casino table + brass/gold trim + oxblood maroon accents
   ========================================================================== */
:root{
  --felt:#0E3B2E;
  --felt-dark:#082821;
  --felt-darker:#051813;
  --gold:#E8B23D;
  --gold-bright:#FFD966;
  --gold-dim:#B8862A;
  --maroon:#8C1F2B;
  --maroon-bright:#B93042;
  --cream:#F6EEDA;
  --ink:#17110A;
  --good:#35C97A;
  --bad:#D64545;
  --disp:'Kanit',sans-serif;
  --body:'Sarabun',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --radius:18px;
  --shadow-deep:0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--body);
  color:var(--cream);
  background:
    radial-gradient(ellipse at top,#164A38 0%,var(--felt) 45%,var(--felt-dark) 100%);
  background-attachment:fixed;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.015) 0px, rgba(255,255,255,.015) 2px, transparent 2px, transparent 14px);
  pointer-events:none;
  z-index:0;
}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:800;letter-spacing:.3px;}
.mono{font-family:var(--mono);}
.hidden{display:none !important;}
button{font-family:var(--body);cursor:pointer;border:none;outline:none;}
button:disabled{opacity:.45;cursor:not-allowed;}
input,select{font-family:var(--body);}

/* brass rivet frame — signature element */
.brass-frame{
  position:relative;
  background:linear-gradient(180deg,#123f30,#0a2a20);
  border-radius:var(--radius);
  border:2px solid var(--gold-dim);
  box-shadow:var(--shadow-deep), inset 0 0 0 1px rgba(232,178,61,.15);
}
.brass-frame::before,.brass-frame::after,
.brass-frame .rivet{
  content:'';
  position:absolute;
  width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #FFE9A8, var(--gold) 55%, var(--gold-dim) 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.6);
}
.brass-frame::before{top:8px;left:8px;}
.brass-frame::after{top:8px;right:8px;}
.brass-frame .rivet.br{bottom:8px;right:8px;}
.brass-frame .rivet.bl{bottom:8px;left:8px;}

.container{max-width:1180px;margin:0 auto;padding:20px;width:100%;flex:1;display:flex;flex-direction:column;}

/* ---- landing / role select ---- */
.landing{margin:auto;text-align:center;max-width:640px;padding:32px;}
.landing .marquee{
  font-size:clamp(38px,7vw,64px);
  color:var(--gold-bright);
  text-shadow:0 0 18px rgba(255,217,102,.55), 0 3px 0 var(--maroon);
  margin:0 0 6px;
}
.landing .sub{color:var(--cream);opacity:.75;margin-bottom:34px;font-size:15px;}
.role-row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;}
.role-card{
  width:220px;padding:26px 18px;border-radius:var(--radius);
  background:linear-gradient(160deg,#164A38,#0a2a20);
  border:1px solid rgba(232,178,61,.35);
  transition:transform .15s, box-shadow .15s, border-color .15s;
}
.role-card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 10px 24px rgba(0,0,0,.4);}
.role-card .ic{font-size:40px;margin-bottom:10px;display:block;}
.role-card b{font-family:var(--disp);font-size:19px;color:var(--gold-bright);display:block;margin-bottom:4px;}
.role-card span{font-size:13px;opacity:.7;}

/* ---- generic panel/card ---- */
.panel{padding:20px 22px;margin-bottom:16px;}
.btn{
  padding:12px 22px;border-radius:12px;font-weight:700;font-size:15px;
  background:linear-gradient(180deg,var(--gold-bright),var(--gold-dim));
  color:var(--ink);box-shadow:0 4px 0 #8a641c, 0 6px 14px rgba(0,0,0,.35);
  transition:transform .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a641c;}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid rgba(246,238,218,.35);box-shadow:none;}
.btn.danger{background:linear-gradient(180deg,#E15C5C,var(--maroon));color:#fff;box-shadow:0 4px 0 #5c1219,0 6px 14px rgba(0,0,0,.35);}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:9px;}
.btn.block{width:100%;}

.field{margin-bottom:14px;text-align:left;}
.field label{display:block;font-size:13px;opacity:.8;margin-bottom:6px;}
.field input[type=text],.field input[type=number]{
  width:100%;padding:11px 13px;border-radius:10px;border:1px solid rgba(246,238,218,.25);
  background:rgba(0,0,0,.25);color:var(--cream);font-size:15px;
}
.field input::placeholder{color:rgba(246,238,218,.4);}

/* avatar picker */
.join-avatar-preview{
  width:88px;height:88px;margin:0 auto 18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:46px;
  background:radial-gradient(circle at 35% 30%,#1c5a44,#0a2a20 70%);
  border:3px solid var(--gold);box-shadow:0 0 0 4px rgba(232,178,61,.18), 0 8px 20px rgba(0,0,0,.4);
}
.join-avatar-preview.pop{animation:avatarPop .45s ease;}
.char-count{text-align:right;font-size:11px;opacity:.5;margin-top:4px;}
.avatar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-bottom:16px;}
.avatar-opt{
  font-size:24px;text-align:center;padding:10px 0;border-radius:12px;aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.2);border:2px solid transparent;
  transition:transform .1s ease, border-color .15s ease, background .15s ease;
  touch-action:manipulation;
}
.avatar-opt:active{transform:scale(.92);}
.avatar-opt.sel{border-color:var(--gold);background:rgba(232,178,61,.18);box-shadow:0 0 0 3px rgba(232,178,61,.15);}
@media(hover:hover){.avatar-opt:hover{border-color:rgba(232,178,61,.5);}}

/* ---- header bar (host + player game views) ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;margin-bottom:14px;flex-wrap:wrap;}
.qcount{font-family:var(--disp);font-size:15px;color:var(--gold-bright);}
.jackpot-badge{
  display:flex;flex-direction:column;gap:5px;padding:8px 18px;border-radius:16px;
  background:linear-gradient(180deg,#1c5a44,#0d3628);border:1px solid var(--gold);min-width:150px;
}
.jackpot-badge .jk-top{display:flex;align-items:center;gap:8px;}
.jackpot-badge .coin{font-size:20px;}
.jackpot-badge .amt{font-family:var(--mono);font-weight:800;font-size:22px;color:var(--gold-bright);line-height:1;}
.jackpot-badge.low .amt{color:var(--bad);animation:potpulse 1s ease-in-out infinite;}
@keyframes potpulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.pot-gauge{width:100%;height:6px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;}
.pot-gauge-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold-dim),var(--gold-bright));transition:width .5s ease;}
.pot-gauge-fill.low{background:linear-gradient(90deg,var(--maroon),var(--bad));}
.answered-count{font-size:13px;opacity:.75;}
.avatar-status-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;}
.avatar-chip{
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.15);
  opacity:.35;filter:grayscale(1);transition:opacity .25s, filter .25s, border-color .25s;
}
.avatar-chip.answered{opacity:1;filter:none;border-color:var(--gold-bright);box-shadow:0 0 10px rgba(232,178,61,.4);animation:avatarPop .45s ease;}
@keyframes avatarPop{0%{transform:scale(.25) rotate(-10deg);}55%{transform:scale(1.3) rotate(8deg);}100%{transform:scale(1) rotate(0);}}
.avatar-waiting{font-size:44px;display:inline-block;animation:avatarBounce 1.1s ease-in-out infinite;}
@keyframes avatarBounce{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-10px) scale(1.06);}}
.avatar-reveal{font-size:52px;display:inline-block;}
.avatar-reveal.happy{animation:avatarBounce .6s ease-in-out 2;}
.avatar-reveal.sad{animation:avatarSad .5s ease-in-out;}
@keyframes avatarSad{0%,100%{transform:translateX(0) rotate(0);}25%{transform:translateX(-6px) rotate(-6deg);}75%{transform:translateX(6px) rotate(6deg);}}
.speed-badge{
  text-align:center;font-family:var(--disp);font-weight:800;color:var(--ink);
  background:linear-gradient(90deg,var(--gold-bright),#FFC94D,var(--gold-bright));
  background-size:200% 100%;animation:speedShimmer 1.3s linear infinite;
  padding:8px 14px;border-radius:10px;margin-bottom:14px;font-size:14px;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
@keyframes speedShimmer{0%{background-position:0% 0;}100%{background-position:200% 0;}}

/* ---- question display ---- */
.qtext{
  font-family:var(--disp);font-size:clamp(20px,3vw,30px);text-align:center;line-height:1.35;
  padding:26px 24px;margin-bottom:20px;color:var(--cream);position:relative;
  background:
    radial-gradient(ellipse at top,rgba(232,178,61,.14),transparent 65%),
    linear-gradient(160deg,rgba(255,255,255,.05),rgba(0,0,0,.18));
  border:1px solid rgba(232,178,61,.35);border-radius:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), inset 0 -12px 24px rgba(0,0,0,.2);
  animation:qtextIn .38s ease;
}
.qtext::before{
  content:'❖';position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  font-size:14px;color:var(--gold-bright);background:var(--felt-dark);padding:0 10px;
}
@keyframes qtextIn{0%{opacity:0;transform:translateY(-6px);}100%{opacity:1;transform:translateY(0);}}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:560px){.choices{grid-template-columns:1fr;}}
@media (max-width:420px){
  .container{padding:12px;}
  .topbar{padding:12px 14px;gap:10px;}
  .jackpot-badge{min-width:0;padding:7px 12px;}
  .jackpot-badge .amt{font-size:18px;}
  .pod-col{width:84px;}
  .pod-col.p1 .pod-bar{height:120px;font-size:20px;}
  .pod-col.p2 .pod-bar{height:92px;font-size:17px;}
  .pod-col.p3 .pod-bar{height:70px;font-size:17px;}
  .podium{gap:8px;}
  .stat-grid{grid-template-columns:1fr;}
  .landing{padding:22px 16px;}
  .landing .sub{margin-bottom:22px;font-size:14px;}
  .role-card{width:100%;max-width:280px;padding:20px 16px;}
  .join-avatar-preview{width:72px;height:72px;font-size:38px;margin-bottom:14px;}
  .avatar-grid{grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;}
  .avatar-opt{font-size:20px;border-radius:10px;}
}
@media (max-width:340px){
  .landing .marquee{font-size:26px;}
  .avatar-grid{grid-template-columns:repeat(5,1fr);}
}
.choice{
  position:relative;overflow:hidden;
  padding:20px 18px 20px 16px;border-radius:16px;text-align:left;font-size:16px;font-weight:700;
  display:flex;align-items:center;gap:14px;color:#fff;
  border:2px solid rgba(255,255,255,.14);
  box-shadow:0 5px 0 rgba(0,0,0,.28), 0 10px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .12s ease, box-shadow .12s ease, filter .15s ease;
  animation:choiceIn .38s ease backwards;
}
.choice:nth-child(1){animation-delay:.02s;}
.choice:nth-child(2){animation-delay:.08s;}
.choice:nth-child(3){animation-delay:.14s;}
.choice:nth-child(4){animation-delay:.20s;}
@keyframes choiceIn{0%{opacity:0;transform:translateY(12px) scale(.96);}100%{opacity:1;transform:translateY(0) scale(1);}}
.choice::after{ /* diagonal glossy shine */
  content:'';position:absolute;top:-70%;left:-25%;width:38%;height:240%;
  background:linear-gradient(120deg,rgba(255,255,255,.28),transparent 65%);
  transform:rotate(18deg);pointer-events:none;
}
.choice:not(.locked):hover{transform:translateY(-3px);box-shadow:0 8px 0 rgba(0,0,0,.28),0 16px 24px rgba(0,0,0,.4);filter:brightness(1.1);}
.choice:not(.locked):active{transform:translateY(3px) scale(.98);box-shadow:0 2px 0 rgba(0,0,0,.28);}
.choice .tag{
  width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:16px;flex-shrink:0;
  border:2px solid rgba(255,255,255,.4);box-shadow:inset 0 2px 3px rgba(0,0,0,.35);
}
.choice-txt{flex:1;}
.choice.c0{background:linear-gradient(160deg,#4A8CC4,#2A5A85);}
.choice.c1{background:linear-gradient(160deg,#D06A3A,#94411F);}
.choice.c2{background:linear-gradient(160deg,#57A369,#316742);}
.choice.c3{background:linear-gradient(160deg,#9C5AB8,#652F7B);}
.choice.correct{outline:3px solid var(--good);filter:brightness(1.18);box-shadow:0 0 22px rgba(53,201,122,.8);animation:correctPop .5s ease;}
.choice.wrong-sel{outline:3px solid var(--bad);filter:brightness(.68);}
.choice.dim{filter:brightness(.5);}
.choice.locked{pointer-events:none;}
@keyframes correctPop{0%{transform:scale(1);}40%{transform:scale(1.045);}100%{transform:scale(1);}}

/* timer ring */
.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:16px;}
.timer-ring{position:relative;width:88px;height:88px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.4));}
.timer-ring svg{transform:rotate(-90deg);width:100%;height:100%;}
.timer-ring circle{fill:none;stroke-width:7;}
.timer-ring .bg{stroke:rgba(255,255,255,.12);}
.timer-ring .fg{stroke:var(--gold-bright);stroke-linecap:round;transition:stroke-dashoffset 1s linear, stroke .3s ease;}
.timer-ring.warn .fg{stroke:#F2A93B;}
.timer-ring.danger .fg{stroke:var(--bad);}
.timer-ring.danger{animation:ringpulse .55s ease-in-out infinite;}
@keyframes ringpulse{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
.timer-ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800;font-size:26px;}

/* reveal bars */
.reveal-list{display:flex;flex-direction:column;gap:10px;}
.rbar-row{display:flex;align-items:center;gap:10px;font-size:14px;}
.rbar-track{flex:1;height:16px;border-radius:8px;background:rgba(0,0,0,.3);overflow:hidden;}
.rbar-fill{height:100%;border-radius:8px;transition:width .6s ease;}
.rbar-fill.ok{background:var(--good);}
.rbar-fill.no{background:rgba(255,255,255,.25);}

/* spinners-strip (players currently eligible to spin) */
.top5-strip{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px;}
.top5-chip{
  padding:8px 14px;border-radius:999px;background:rgba(232,178,61,.15);
  border:1px solid var(--gold-dim);font-size:13px;display:flex;gap:6px;align-items:center;
}
.top5-chip .rk{font-family:var(--disp);color:var(--gold-bright);}

/* ==========================================================================
   SLOT MACHINE — signature element: 3-reel cabinet, brass trim, real spin
   ========================================================================== */
.slot-cabinet{
  display:flex;flex-direction:column;align-items:center;gap:18px;padding:clamp(16px,4vw,28px) 10px;
}
.slot-body{
  position:relative;padding:16px;border-radius:22px;
  background:linear-gradient(160deg,#2a1408,#1a0c05 60%,#120802);
  border:3px solid var(--gold-dim);
  box-shadow:0 0 0 2px var(--ink), var(--shadow-deep), inset 0 0 30px rgba(0,0,0,.6);
}
.slot-body::before{ /* marquee light strip */
  content:'';position:absolute;left:14px;right:14px;top:6px;height:4px;border-radius:4px;
  background:repeating-linear-gradient(90deg,var(--gold-bright) 0 8px,transparent 8px 16px);
  opacity:.85;
}
.slot-topper{
  font-family:var(--disp);font-weight:900;text-align:center;font-size:clamp(13px,3.2vw,16px);
  color:var(--gold-bright);letter-spacing:1px;margin-bottom:10px;text-shadow:0 0 10px rgba(255,217,102,.5);
}
.reels-row{display:flex;gap:clamp(6px,1.6vw,12px);background:#000;padding:10px;border-radius:14px;
  box-shadow:inset 0 4px 14px rgba(0,0,0,.8);}
.reel-window{
  width:clamp(64px,20vw,104px);height:clamp(64px,20vw,104px);border-radius:10px;overflow:hidden;position:relative;
  background:linear-gradient(180deg,var(--felt-darker),#0a1210);
  box-shadow:inset 0 0 18px rgba(0,0,0,.8), 0 0 0 2px rgba(232,178,61,.4);
}
.reel-window::before,.reel-window::after{ /* top/bottom shadow so symbols fade at edges */
  content:'';position:absolute;left:0;right:0;height:26%;z-index:2;pointer-events:none;
}
.reel-window::before{top:0;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);}
.reel-window::after{bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);}
.reel-strip{position:absolute;left:0;top:0;width:100%;display:flex;flex-direction:column;will-change:transform;}
.reel-sym{height:clamp(64px,20vw,104px);display:flex;align-items:center;justify-content:center;
  font-size:clamp(30px,10vw,52px);flex-shrink:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));}
.reel-window.spinning .reel-strip{animation:reelspin .18s linear infinite;filter:blur(2px);}
@keyframes reelspin{0%{transform:translateY(0);}100%{transform:translateY(-75%);}}
.reel-window.win-glow{box-shadow:inset 0 0 18px rgba(0,0,0,.8), 0 0 0 2px var(--gold-bright), 0 0 22px rgba(255,217,102,.85);}
@keyframes shakeMachine{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px) rotate(-.4deg);}40%{transform:translateX(5px) rotate(.4deg);}60%{transform:translateX(-4px);}80%{transform:translateX(3px);}}
.slot-body.shake{animation:shakeMachine .4s ease;}
.slot-lever-wrap{display:flex;align-items:center;gap:14px;}
.spin-btn{
  width:clamp(88px,24vw,118px);height:clamp(88px,24vw,118px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFE9A8,var(--gold) 55%,var(--gold-dim) 100%);
  color:var(--ink);font-family:var(--disp);font-size:clamp(15px,4vw,20px);font-weight:800;
  box-shadow:0 6px 0 #8a641c,0 10px 20px rgba(0,0,0,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
}
.spin-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a641c;}
.reel-label{font-family:var(--disp);font-size:clamp(16px,4vw,20px);color:var(--gold-bright);text-align:center;}
.reel-sub{font-size:13px;opacity:.75;text-align:center;max-width:280px;}
/* double or nothing */
.don-card{max-width:360px;padding:22px 20px;text-align:center;}
.don-title{font-family:var(--disp);font-size:20px;color:var(--gold-bright);margin-bottom:10px;}
.don-desc{font-size:13.5px;opacity:.85;line-height:1.6;margin-bottom:12px;}
.don-score{font-size:14px;margin-bottom:14px;}
.don-options{display:flex;flex-direction:column;gap:8px;}
.don-badge{
  font-size:13px;text-align:center;padding:7px 14px;border-radius:10px;margin-bottom:6px;
  background:rgba(232,178,61,.15);border:1px solid var(--gold-dim);color:var(--gold-bright);
}
.don-result{
  margin-top:12px;text-align:center;font-size:14px;padding:9px 14px;border-radius:10px;
  animation:revealPop .4s ease;
}
.don-result.win{background:rgba(53,201,122,.16);border:1px solid var(--good);color:#8FF0B8;}
.don-result.lose{background:rgba(214,69,69,.16);border:1px solid var(--bad);color:#FFB0B0;}
.outcome-banner{
  font-family:var(--disp);font-size:clamp(18px,5vw,26px);padding:16px 26px;border-radius:14px;text-align:center;
  animation:pop .35s ease;
}
@keyframes pop{0%{transform:scale(.6);opacity:0;}70%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
.outcome-banner.good{background:rgba(53,201,122,.18);color:#8FF0B8;border:1px solid var(--good);}
.outcome-banner.bad{background:rgba(214,69,69,.18);color:#FFB0B0;border:1px solid var(--bad);}

<script>
/* ==========================================================================
   SOUND — tiny WebAudio synth, no external files
   ========================================================================== */
let sndOn = true;
let sndVolume = 0.7;
try{ const savedVol = localStorage.getItem('jqa_snd_vol'); if(savedVol!=null) sndVolume = Math.max(0,Math.min(1, Number(savedVol)/100)); }catch(e){}
let actx = null;
function ac(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function beep(freq, dur, type='sine', vol=.18, delay=0){
  if(!sndOn || sndVolume<=0) return;
  const c = ac(); const t0 = c.currentTime + delay;
  const osc = c.createOscillator(); const gain = c.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  const v = vol * sndVolume;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(v, t0+.015);
  gain.gain.exponentialRampToValueAtTime(.001, t0+dur);
  osc.connect(gain); gain.connect(c.destination);
  osc.start(t0); osc.stop(t0+dur+.02);
}
const SND = {
  tick: ()=>beep(880,.06,'square',.08),

  wrong: ()=>{beep(180,.28,'sawtooth',.15);},

  spinloop: ()=>beep(300+Math.random()*200,.05,'square',.05),
  coin: ()=>{beep(988,.08,'square',.15);beep(1318,.1,'square',.15,.06);},
  jackpot: ()=>{[0,.1,.2,.3,.45].forEach((d,i)=>beep(660+i*110,.22,'sine',.22,d));},
  bomb: ()=>beep(90,.4,'sawtooth',.22),

/* ---- suspense drone: a sustained rising pad played under the spin-loop

function startSpinDrone(){
  if(!sndOn || sndVolume<=0) return null;
  try{
    const c = ac();
    const osc = c.createOscillator(); const osc2 = c.createOscillator(); const gain = c.createGain();
    osc.type = 'sawtooth'; osc2.type = 'triangle';

    osc2.frequency.setValueAtTime(90*1.5, c.currentTime);

function riseSpinDrone(drone, durMs){

  if(!drone) return;
  try{
    const c = ac(); const now = c.currentTime;
    drone.gain.gain.linearRampToValueAtTime(0, now+.28);
    drone.osc.stop(now+.32); drone.osc2.stop(now+.32);
  }catch(e){}
}

/* ==========================================================================
   HELPERS
   ========================================================================== */
const AVATARS = ['🦁','🐯','🐼','🦊','🐸','🐵','🦄','🐙','🦖','🐲','🦉','🐺','🐨','🦈','🐝','🦋','🐧','🐢'];
/* ---- pot economy: every "good" outcome pulls points OUT of the shared pot,
   BOMB pays a chunk of the loser's points back IN. When the pot hits 0 the
   game ends — the class is literally racing to empty the jackpot. ---- */
const OUTCOMES = [
  {key:'GRAND', label:'GRAND JACKPOT!', weight:4,  sym:'💎', tone:'good'},
  {key:'MINI',  label:'MINI JACKPOT',   weight:12, sym:'🪙', tone:'good'},
  {key:'BONUS', label:'โบนัส',          weight:22, sym:'⭐', tone:'good'},
  {key:'STEAL', label:'ขโมยแต้ม',       weight:14, sym:'🦹', tone:'bad'},
  {key:'BOMB',  label:'ระเบิด!',        weight:14, sym:'💣', tone:'bad'},
  {key:'MISS',  label:'ไม่ได้อะไรเลย',   weight:34, sym:'🔔', tone:'neutral'},
];
// decorative filler symbols used only to build the scrolling reel strip
const FILLER_SYMS = ['🍒','🍋','🍇','7️⃣','🔔','⭐'];
/* ---- teacher-editable drop rates: GAME.meta.outcomeWeights (key -> weight)
   overrides the defaults above so the teacher can tune odds live; a weight
   of 0 means that item is disabled (never drawn).
   forWrongAnswer=true shrinks only the "good" (tone:'good') outcomes by
   GAME.meta.wrongSpinGoodMult (default 0.35 = 35% of the normal chance),
   so a player who answered incorrectly can still spin but is meaningfully
   less likely to land a jackpot/bonus than someone who answered correctly.
   Bad/neutral outcome weights are left untouched either way. ---- */
function effectiveOutcomes(forWrongAnswer){
  const ow = (GAME && GAME.meta && GAME.meta.outcomeWeights) || {};
  const wrongMult = (GAME && GAME.meta && GAME.meta.wrongSpinGoodMult != null && !isNaN(GAME.meta.wrongSpinGoodMult))
    ? Math.max(0, Number(GAME.meta.wrongSpinGoodMult)) : 0.35;
  return OUTCOMES.map(o=>{
    let weight = (ow[o.key]!=null && !isNaN(ow[o.key])) ? Math.max(0,Number(ow[o.key])) : o.weight;
    if(forWrongAnswer && o.tone==='good') weight = weight * wrongMult;
    return { ...o, weight };
  });
}
function pickOutcome(forWrongAnswer){
  const list = effectiveOutcomes(forWrongAnswer);
  const total = list.reduce((s,o)=>s+o.weight,0);
  if(total<=0) return list[list.length-1];
  let r = Math.random()*total;
  for(const o of list){ if(r<o.weight) return o; r-=o.weight; }
  return list[list.length-1];
}
function uid(){ return 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toast(msg, ms=2400){
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(), ms);
}
function fmtNum(n){ return Math.round(n).toLocaleString('th-TH'); }
function letterOf(i){ return ['A','B','C','D'][i]; }

/* ---- shared pot-gauge widget: used everywhere the jackpot badge appears ---- */
function jackpotBadgeHTML(extraStyle){

  return `<div class="jackpot-badge ${low?'low':''}" ${extraStyle?`style="${extraStyle}"`:''}>
    <div class="jk-top"><span class="coin">🪙</span><span class="amt mono">${fmtNum(jk)}</span></div>
    <div class="pot-gauge"><div class="pot-gauge-fill ${low?'low':''}" style="width:${pct}%"></div></div>
  </div>`;
}

// simple CSV parser (handles quoted commas)
function parseCSV(text){
  const rows = []; let row=[]; let cur=''; let inQ=false;
  text = text.replace(/\r\n/g,'\n');
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; }
      else cur+=c;
    } else {
      if(c === '"') inQ=true;
      else if(c === ','){ row.push(cur); cur=''; }
      else if(c === '\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else cur+=c;
    }
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c=>c && c.trim().length));
}
function questionsFromCSV(text){
  const rows = parseCSV(text);
  let start = 0;
  // skip header row if it looks like one
  if(rows[0] && /คำถาม|question/i.test(rows[0][0]||'')) start = 1;
  const qs = [];
  for(let i=start;i<rows.length;i++){
    const r = rows[i];
    if(r.length < 6) continue;
    const [q,a,b,c,d,ans] = r.map(x=>(x||'').trim());
    if(!q) continue;
    const idx = {a:0,b:1,c:2,d:3}[ans.toLowerCase()] ?? ['a','b','c','d'].indexOf(ans.toLowerCase());
    qs.push({ q, choices:[a,b,c,d], correct: idx>=0?idx:0 });
  }
  return qs;
}

<script>
/* ==========================================================================
   APP STATE + ROUTER
   ========================================================================== */
const root = document.getElementById('appRoot');
let ROLE = null; // 'host' | 'player'
let GAME = null; // live mirror of /jackpotRooms/{ROOM}
let ME = { id:null, name:null, avatar:null };
let myAnswerLocked = false;
let mySpinDone = false;
let reelTimer = null;
// tracks an in-progress local spin animation so an unrelated realtime update
// (e.g. a classmate spinning at the same moment) doesn't yank the reels out
// from under the current player mid-animation
let localSpin = null; // {qi, outcome, finals, spinning:bool}
let playerTickInt = null;
let lastRevealSoundQi = null;

function loadMe(){
  try{
    const saved = JSON.parse(localStorage.getItem('jqa_me')||'null');
    if(saved && saved.id){ ME = saved; return true; }
  }catch(e){}
  return false;
}
function saveMe(){ localStorage.setItem('jqa_me', JSON.stringify(ME)); }

/* ==========================================================================
   ROOM (multi-room support) + RECONNECT / RESUME
   ทุกเกมแยกกันอยู่คนละห้องใต้ ROOMS_ROOT/{ROOM} แทนที่จะชนกันที่ path เดียว
   นอกจากนี้ ROLE/ROOM ยังถูกจำไว้ใน localStorage เพื่อให้ครูปิด-เปิดแท็บ/มือถือดับ
   แล้วกลับเข้าห้องเดิมได้ทันที ไม่ต้องเริ่มใหม่
   ========================================================================== */
let gameListenerRef = null;
let gameSyncTimeoutId = null;
window.__gameSyncError = null; // null = ok/pending, or {reason} once we know it failed
function attachGameListener(){
  if(gameListenerRef) return; // already listening
  window.__gameSyncError = null;
  gameListenerRef = gref();
  // Safety net: if neither the success NOR the error callback below has
  // fired within a few seconds (e.g. the SDK silently stalls on a flaky
  // mobile connection), stop spinning forever and give the user something
  // actionable instead of an infinite "กำลังเชื่อมต่อห้อง..." screen.
  clearTimeout(gameSyncTimeoutId);
  gameSyncTimeoutId = setTimeout(()=>{
    if(!window.__gameSynced && !window.__gameSyncError){
      window.__gameSyncError = { code:'timeout' };
      render();
    }
  }, 9000);
  gameListenerRef.on('value', snap => {
    clearTimeout(gameSyncTimeoutId);
    window.__gameSyncError = null;
    GAME = snap.val();
    window.__gameSynced = true;
    render();
  }, err => {
    // Most common real-world cause: Firebase Realtime Database security
    // rules deny read on this path (rules not set, or a "test mode" rule
    // that already expired) — the SDK never calls the success callback in
    // that case, so without this handler the app was stuck showing the
    // "connecting" spinner forever with no explanation.
    clearTimeout(gameSyncTimeoutId);
    console.error('attachGameListener error:', err);
    window.__gameSyncError = { code: (err && err.code) || 'unknown', message: (err && err.message) || String(err) };
    window.__gameSynced = false;
    render();
  });
  attachReactionsListener();
}
function detachGameListener(){
  clearTimeout(gameSyncTimeoutId);
  window.__gameSyncError = null;
  if(gameListenerRef){ gameListenerRef.off(); gameListenerRef = null; }
  detachReactionsListener();
}

/* ---- reactions floater listener: defined here (not down near where the
   floating-emoji rendering lives) so that attachGameListener() can safely
   call it during the very first page load (autoResume, below) — by the time
   a later <script> block finishes running, this one has already executed. */
let lastReactionKey = null;
let reactionsListenerRef = null;
function attachReactionsListener(){
  if(reactionsListenerRef) return;
  reactionsListenerRef = gref('reactions');
  reactionsListenerRef.on('value', snap=>{
    const val = snap.val(); if(!val) return;
    const keys = Object.keys(val);
    const newest = keys[keys.length-1];
    if(newest && newest !== lastReactionKey){
      lastReactionKey = newest;
      const r = val[newest];
      const el = document.createElement('div');
      el.className = 'react-float';
      el.style.left = (10+Math.random()*80)+'%';
      el.textContent = r.emoji;
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 2500);
    }
  }, err => {
    // Non-fatal (reactions are cosmetic) — just stop retrying silently
    // forever and log it, instead of leaving a listener that never fires.
    console.error('attachReactionsListener error:', err);
  });
}
function detachReactionsListener(){
  if(reactionsListenerRef){ reactionsListenerRef.off(); reactionsListenerRef = null; }
  lastReactionKey = null;
}
function persistSession(){
  try{
    if(ROOM && ROLE){ localStorage.setItem('jqa_room', ROOM); localStorage.setItem('jqa_role', ROLE); }
  }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem('jqa_room'); localStorage.removeItem('jqa_role'); }catch(e){}
}
function enterRoom(code, role, opts){
  opts = opts || {};
  ROOM = (code||'').toUpperCase();
  ROLE = role;
  window.__gameSynced = false;
  window.__gameSyncError = null;
  persistSession();
  try{
    const url = new URL(location.href);
    url.searchParams.set('room', ROOM);
    history.replaceState(null, '', url.toString());
  }catch(e){}
  attachGameListener();
  // opts.silent: used only by autoResume() during the very first synchronous
  // script execution, before renderHost/renderPlayer (defined in later
  // <script> blocks) exist yet — the final `render()` call at the bottom of
  // the file performs the actual first paint once everything is loaded.
  if(!opts.silent) render();
}
function leaveRoom(){
  detachGameListener();
  clearSession();
  window.__gameSynced = false;
  window.__gameSyncError = null;
  ROOM = null; ROLE = null; GAME = null;
  try{
    const url = new URL(location.href);
    url.searchParams.delete('room');
    history.replaceState(null, '', url.toString());
  }catch(e){}
  render();
}
function urlRoomParam(){
  try{ return new URLSearchParams(location.search).get('room'); }catch(e){ return null; }
}

function render(){
  if(!ROLE || !ROOM){ renderLanding(); removeHostControlPanel(); return; }
  if(window.__gameSyncError){ renderRoomSyncError(window.__gameSyncError); removeHostControlPanel(); return; }
  if(!window.__gameSynced){ renderRoomLoading(); return; }
  if(ROLE === 'host'){ renderHost(); mountHostControlPanel(); return; }
  if(ROLE === 'player'){ renderPlayer(); removeHostControlPanel(); return; }
}

/* ---- shown briefly while reconnecting to a room whose data hasn't arrived
   from Firebase yet (first snapshot still in flight) — avoids flashing the
   wrong screen (e.g. "setup") for a split second while resuming. ---- */
function renderRoomLoading(){
  root.innerHTML = `
    <div class="center-msg">
      <div class="ic">🔄</div>
      <div style="font-family:var(--disp);font-size:18px;color:var(--gold-bright);">กำลังเชื่อมต่อห้อง ${esc(ROOM||'')}...</div>
      <div style="margin-top:10px;opacity:.7;font-size:13px;">รอสักครู่...</div>
    </div>`;
}

/* ---- shown when attachGameListener's Firebase listener either came back
   with a real error (most commonly "permission_denied" — the Realtime
   Database security rules don't allow reading /jackpotRooms, e.g. because
   they were never set or a "test mode" rule already expired) or simply
   never fired at all within a few seconds. Previously there was no error
   path here at all, so this situation looked identical to a permanently
   spinning "กำลังเชื่อมต่อห้อง..." screen with no way out. ---- */
function renderRoomSyncError(errInfo){
  const isPermission = errInfo && /permission/i.test(errInfo.code||'');
  const isTimeout = errInfo && errInfo.code === 'timeout';
  const detail = isPermission
    ? 'สาเหตุที่พบบ่อยที่สุด: กฎความปลอดภัย (Rules) ของ Firebase Realtime Database ยังไม่ได้อนุญาตให้อ่านข้อมูล หรือกฎแบบ "โหมดทดสอบ" หมดอายุแล้ว — ต้องเข้าไปตั้งค่าใน Firebase Console → Realtime Database → Rules'
    : isTimeout
      ? 'เชื่อมต่อกับเซิร์ฟเวอร์เกินเวลาที่กำหนด อาจเป็นเพราะอินเทอร์เน็ตไม่เสถียร หรือกฎความปลอดภัยของฐานข้อมูลปฏิเสธการอ่านข้อมูลแบบเงียบ ๆ'
      : 'เกิดข้อผิดพลาดขณะเชื่อมต่อฐานข้อมูล';
  root.innerHTML = `
    <div class="center-msg">
      <div class="ic">⚠️</div>
      <div style="font-family:var(--disp);font-size:18px;color:var(--maroon-bright);">เชื่อมต่อห้อง ${esc(ROOM||'')} ไม่สำเร็จ</div>
      <div style="margin-top:10px;opacity:.85;font-size:13px;max-width:420px;margin-left:auto;margin-right:auto;">${esc(detail)}</div>
      ${errInfo && errInfo.message ? `<div class="mono" style="margin-top:8px;opacity:.55;font-size:11px;">${esc(errInfo.code||'')}: ${esc(errInfo.message)}</div>` : ''}
      <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <button class="btn" id="syncRetryBtn">🔄 ลองใหม่</button>
        <button class="btn ghost" id="syncBackBtn">← กลับหน้าแรก</button>
      </div>
    </div>`;
  document.getElementById('syncRetryBtn').onclick = ()=>{
    window.__gameSyncError = null;
    window.__gameSynced = false;
    detachGameListener();
    attachGameListener();
    render();
  };
  document.getElementById('syncBackBtn').onclick = ()=> leaveRoom();
}

/* -------------------------------------------------------------------------- */
function renderLanding(){
  const urlRoom = urlRoomParam();
  root.innerHTML = `
    <div class="landing">
      <h1 class="marquee">🎰 JACKPOT<br>QUIZ ARENA</h1>
      <div class="sub">เกมตอบคำถามชิงตู้แจ็คพอทสด สำหรับห้องเรียน ~40 คน</div>
      <div class="role-row">
        <div class="role-card" id="pickHost"><span class="ic">🎙️</span><b>ครู / โฮสต์</b><span>ควบคุมเกม แสดงจอใหญ่</span></div>
        <div class="role-card" id="pickPlayer"><span class="ic">📱</span><b>ผู้เล่น</b><span>เข้าเกมด้วยมือถือ</span></div>
      </div>
      ${urlRoom? `<div class="sub" style="margin-top:18px;">ลิงก์นี้พาไปห้อง <b class="mono" style="color:var(--gold-bright);">${esc(urlRoom)}</b> โดยอัตโนมัติเมื่อกด "ผู้เล่น"</div>`:''}
    </div>`;
  document.getElementById('pickHost').onclick = ()=>{ renderHostRoomChoice(); };

}

function renderHostRoomChoice(){

      ${hasPrev? `

        <div class="sub">ระบบจะสุ่มรหัสห้อง 5 ตัวอักษรให้อัตโนมัติ เพื่อกันชนกับครูคนอื่นที่เปิดเกมพร้อมกัน</div>
        <button class="btn block" id="newRoomBtn" style="max-width:280px;margin:0 auto;">➕ สร้างห้องใหม่</button>
      `}
      <button class="btn ghost sm" id="backBtn" style="margin-top:18px;">← กลับ</button>

function renderPlayerRoomEntry(prefill){
  if(prefill){ tryJoinRoomCode(prefill); return; }
  let lastRoom = null, lastRole = null;
  try{ lastRoom = localStorage.getItem('jqa_room'); lastRole = localStorage.getItem('jqa_role'); }catch(e){}
  const hasPrev = lastRoom && lastRole === 'player';
  root.innerHTML = `
    <div class="landing">
      <h1 class="marquee" style="font-size:32px;">📱 เข้าร่วมห้อง</h1>
      <div class="sub">ใส่รหัสห้อง 5 หลักที่ครูให้ (ดูจากจอใหญ่ หรือสแกน QR)</div>
      <div class="field" style="max-width:280px;margin:0 auto 14px;">
        <input type="text" class="room-code-input" id="roomCodeInput" maxlength="5" placeholder="ABCDE">
      </div>
      <button class="btn" id="roomJoinBtn">ต่อไป →</button>
      ${hasPrev? `<div class="sub" style="margin-top:16px;">หรือ <span id="resumePlayerRoom" style="color:var(--gold-bright);text-decoration:underline;cursor:pointer;">กลับเข้าห้องล่าสุด (${esc(lastRoom)})</span></div>`:''}
      <div style="margin-top:18px;"><button class="btn ghost sm" id="backBtn">← กลับ</button></div>
    </div>`;
  const input = document.getElementById('roomCodeInput');
  input.oninput = ()=>{ input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5); };
  input.onkeydown = (e)=>{ if(e.key==='Enter') document.getElementById('roomJoinBtn').click(); };
  document.getElementById('roomJoinBtn').onclick = ()=> tryJoinRoomCode(input.value);
  const resumeEl = document.getElementById('resumePlayerRoom');
  if(resumeEl) resumeEl.onclick = ()=> tryJoinRoomCode(lastRoom);
  document.getElementById('backBtn').onclick = ()=>{ render(); };
}

function tryJoinRoomCode(code){
  code = (code||'').toUpperCase().trim();
  if(code.length !== 5){ toast('กรุณาใส่รหัสห้อง 5 หลักให้ครบ'); renderPlayerRoomEntry(null); return; }
  toast('⏳ กำลังตรวจสอบห้อง...', 1500);
  db.ref(ROOMS_ROOT+'/'+code+'/meta').once('value').then(snap=>{
    if(!snap.exists()){ toast('❌ ไม่พบห้องรหัสนี้ ตรวจสอบกับครูอีกครั้ง'); renderPlayerRoomEntry(null); return; }
    enterRoom(code, 'player');
  }).catch(()=>{ toast('เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'); renderPlayerRoomEntry(null); });
}

/* ---- auto-resume on page load: if we already have a room+role saved from a
   previous visit (app closed / wifi dropped / tab reloaded), jump straight
   back in instead of showing the landing screen again. ---- */
(function autoResume(){
  const urlRoom = urlRoomParam();
  let savedRoom=null, savedRole=null;
  try{ savedRoom = localStorage.getItem('jqa_room'); savedRole = localStorage.getItem('jqa_role'); }catch(e){}
  if(urlRoom && savedRole === 'player' && savedRoom !== urlRoom){
    // a fresh join-link for a different room takes priority over an old session
    return;
  }
  if(savedRoom && savedRole){
    loadMe();
    enterRoom(savedRoom, savedRole, {silent:true});
  }
})();
</script>

<script>
/* ==========================================================================
   HOST VIEW
   ========================================================================== */
function frameWrap(inner, cls=''){
  return `<div class="brass-frame ${cls}"><span class="rivet bl"></span><span class="rivet br"></span>${inner}</div>`;
}

function renderHost(){
  if(!GAME || !GAME.meta || GAME.meta.phase === 'setup'){ renderHostSetup(); return; }
  const phase = GAME.meta.phase;
  if(phase === 'lobby'){ renderHostLobby(); return; }
  if(phase === 'end'){ renderHostEnd(); return; }
  renderHostGame(phase);
}

/* ---- saved question-set library (localStorage, per-browser) ---- */
function getSavedSets(){ try{ return JSON.parse(localStorage.getItem('jqa_saved_sets')||'{}'); }catch(e){ return {}; } }
function writeSavedSets(obj){ localStorage.setItem('jqa_saved_sets', JSON.stringify(obj)); }
function saveCurrentSet(){
  if(!window.__pendingQs || !window.__pendingQs.length){ toast('ยังไม่มีคำถามให้บันทึก'); return; }
  const name = prompt('ตั้งชื่อชุดคำถามนี้ (เช่น "วิทยาศาสตร์ ป.5 บทที่ 3"):');
  if(!name) return;
  const sets = getSavedSets();
  sets[name] = window.__pendingQs;
  writeSavedSets(sets);
  toast(`บันทึกชุดคำถาม "${name}" แล้ว`);
  renderHostSetup();
}
function loadSavedSet(name){
  const sets = getSavedSets();
  if(!sets[name]) return;
  window.__pendingQs = JSON.parse(JSON.stringify(sets[name]));
  window.__qFormOpen = false; window.__qEditIndex = null;
  renderHostSetup();
  toast(`โหลดชุดคำถาม "${name}" แล้ว (${sets[name].length} ข้อ)`);
}
function deleteSavedSet(name){
  if(!confirm(`ลบชุดคำถาม "${name}" ที่บันทึกไว้?`)) return;
  const sets = getSavedSets();
  delete sets[name];
  writeSavedSets(sets);
  renderHostSetup();
}
function renameSavedSet(name){
  const sets = getSavedSets();
  if(!sets[name]) return;
  const newName = prompt('ตั้งชื่อใหม่ให้ชุดคำถามนี้:', name);
  if(!newName || newName===name) return;
  if(sets[newName] && !confirm(`มีชุดชื่อ "${newName}" อยู่แล้ว ต้องการเขียนทับหรือไม่?`)) return;
  sets[newName] = sets[name];
  delete sets[name];
  writeSavedSets(sets);
  toast(`เปลี่ยนชื่อเป็น "${newName}" แล้ว`);
  renderHostSetup();
}
function duplicateSavedSet(name){
  const sets = getSavedSets();
  if(!sets[name]) return;
  let base = name + ' (สำเนา)', i=2;
  while(sets[base]){ base = name+` (สำเนา ${i})`; i++; }
  sets[base] = JSON.parse(JSON.stringify(sets[name]));
  writeSavedSets(sets);
  toast(`ทำสำเนาเป็น "${base}" แล้ว`);
  renderHostSetup();
}
/* ---- backup/restore: export a saved set (or the currently-loaded set) to a
   .json file the teacher can keep outside the browser, and re-import it —
   protects the question bank from being lost if localStorage/browser data
   ever gets cleared. ---- */
function exportSetJSON(name){
  const sets = getSavedSets();
  const data = name ? sets[name] : window.__pendingQs;
  const label = name || 'ชุดคำถามปัจจุบัน';
  if(!data || !data.length){ toast('ไม่มีคำถามให้ Export'); return; }
  const blob = new Blob([JSON.stringify({ name:label, questions:data }, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (name||'question-set').replace(/[\\/:*?"<>|]/g,'_') + '.json';
  a.click();
  toast(`Export "${label}" แล้ว`);
}
function exportAllSetsJSON(){
  const sets = getSavedSets();
  if(!Object.keys(sets).length){ toast('ยังไม่มีชุดคำถามที่บันทึกไว้'); return; }
  const blob = new Blob([JSON.stringify(sets, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'jackpot-quiz-arena-question-bank.json';
  a.click();
  toast('Export คลังคำถามทั้งหมดแล้ว');
}
function importSetJSON(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      const sets = getSavedSets();
      let added = 0;
      // supports 3 shapes: {name, questions:[...]}, a raw [...] array, or a
      // full bank export {"Set A":[...], "Set B":[...]}
      if(parsed && Array.isArray(parsed.questions)){
        let nm = parsed.name || 'นำเข้า '+new Date().toLocaleDateString('th-TH');
        while(sets[nm]) nm += ' (ใหม่)';
        sets[nm] = parsed.questions; added = 1;
      } else if(Array.isArray(parsed)){
        let nm = 'นำเข้า '+new Date().toLocaleDateString('th-TH');
        while(sets[nm]) nm += ' (ใหม่)';
        sets[nm] = parsed; added = 1;
      } else if(parsed && typeof parsed === 'object'){
        Object.entries(parsed).forEach(([nm, qs])=>{
          if(!Array.isArray(qs)) return;
          let finalName = nm;
          while(sets[finalName]) finalName += ' (ใหม่)';
          sets[finalName] = qs; added++;
        });
      }
      if(!added){ toast('ไฟล์นี้ไม่ใช่รูปแบบชุดคำถามที่รองรับ'); return; }
      writeSavedSets(sets);
      toast(`นำเข้าชุดคำถามสำเร็จ ${added} ชุด`);
      renderHostSetup();
    }catch(e){ toast('อ่านไฟล์ไม่สำเร็จ — ตรวจสอบว่าเป็นไฟล์ .json ที่ถูกต้อง'); }
  };
  reader.readAsText(file);
}

/* ---- manual question add / edit form ---- */
function qFormTemplate(){
  const editing = window.__qEditIndex !== null && window.__qEditIndex !== undefined;
  const q = editing ? window.__pendingQs[window.__qEditIndex] : { q:'', choices:['','','',''], correct:0 };
  return `
    <div class="qedit-form">
      <div class="cp-sec-title" style="margin-bottom:10px;">${editing? `✏️ แก้ไขคำถามข้อที่ ${window.__qEditIndex+1}` : '➕ เพิ่มคำถามใหม่ด้วยตนเอง'}</div>
      <div class="field"><label>คำถาม</label><input type="text" id="qfText" value="${esc(q.q)}" placeholder="พิมพ์คำถาม..."></div>
      <div class="choice-edit-grid">
        ${[0,1,2,3].map(i=>`
          <div class="field" style="margin-bottom:0;">
            <label>ตัวเลือก ${letterOf(i)} ${q.correct===i?'✅':''}</label>
            <input type="text" id="qfC${i}" value="${esc(q.choices[i]||'')}" placeholder="ตัวเลือก ${letterOf(i)}">
          </div>
        `).join('')}
      </div>
      <div class="field" style="margin-top:10px;">
        <label>คำตอบที่ถูกต้อง</label>
        <div class="row">
          ${[0,1,2,3].map(i=>`<label style="display:flex;align-items:center;gap:4px;font-size:13px;"><input type="radio" name="qfCorrect" value="${i}" ${q.correct===i?'checked':''}> ${letterOf(i)}</label>`).join('')}
        </div>
      </div>
      <div class="row" style="margin-top:12px;">
        <button class="btn sm" id="qfSaveBtn">${editing? '💾 บันทึกการแก้ไข':'➕ เพิ่มคำถามนี้'}</button>
        <button class="btn ghost sm" id="qfCancelBtn">ยกเลิก</button>
      </div>
    </div>
  `;
}

function renderHostSetup(){
  const qCount = window.__pendingQs ? window.__pendingQs.length : 0;
  const savedSets = getSavedSets();
  const savedNames = Object.keys(savedSets);
  root.innerHTML = `
    <div class="topbar brass-frame"><span class="rivet bl"></span><span class="rivet br"></span>

    </div>
    ${frameWrap(`

          ${savedNames.map(n=>`

                <button class="cp-mini" data-expset="${esc(n)}" title="Export .json">📤</button>
                <button class="cp-mini danger" data-delset="${esc(n)}" title="ลบ">🗑️</button>
              </div>
            </div>
          `).join('')}
          <div class="row" style="margin-top:6px;"><button class="btn ghost sm" id="exportAllBtn">📤 Export คลังคำถามทั้งหมด (.json)</button></div>
        </div>` : ''}

        <div class="field">
          <label>💾 สำรอง/กู้คืนชุดคำถาม (ไฟล์ .json — ใช้ได้แม้เปลี่ยนเครื่อง/เบราว์เซอร์)</label>
          <div class="file-drop">
            <input type="file" id="jsonFile" accept=".json">
            <div class="cp-note" style="margin-top:6px;">นำเข้าไฟล์ .json ที่ Export ไว้ก่อนหน้า (รองรับทั้งไฟล์ชุดเดียวและไฟล์คลังคำถามรวม)</div>
          </div>
        </div>

        <div class="field">
          <label>นำเข้าคำถามจากไฟล์ CSV</label>
          <div class="file-drop">
            รูปแบบคอลัมน์: <b>คำถาม, ตัวเลือกA, ตัวเลือกB, ตัวเลือกC, ตัวเลือกD, เฉลย(A/B/C/D)</b><br>
            <input type="file" id="csvFile" accept=".csv">
            <div style="margin-top:8px;"><button class="btn ghost sm" id="dlTemplate">⬇️ ดาวน์โหลดไฟล์ตัวอย่าง CSV</button></div>
          </div>
        </div>

        <div class="row" style="margin-bottom:8px;">
          <button class="btn ghost sm" id="addQBtn">➕ เพิ่มคำถามเอง</button>
          ${qCount? `<button class="btn ghost sm" id="saveSetBtn">💾 บันทึกชุดนี้ไว้ใช้ครั้งหน้า</button>`:''}
          ${qCount? `<button class="btn ghost sm" id="exportCurBtn">📤 Export ชุดนี้ (.json)</button>`:''}
        </div>
        <div id="qFormWrap">${window.__qFormOpen? qFormTemplate() : ''}</div>

        <div id="qPreviewWrap"></div>
        <button class="btn block" id="startLobbyBtn" ${qCount? '' : 'disabled'} style="margin-top:16px;">
          🚪 เปิดห้องรอผู้เล่น ${qCount? `(${qCount} ข้อพร้อมแล้ว)`:''}
        </button>
      </div>
    `)}
    <div class="footer-note">Jackpot Quiz Arena · โหมดโฮสต์</div>
  `;
  document.getElementById('backBtn').onclick = ()=>{ leaveRoom(); };
  document.getElementById('dlTemplate').onclick = downloadTemplate;
  root.querySelectorAll('[data-load]').forEach(el=> el.onclick = ()=> loadSavedSet(el.dataset.load));
  root.querySelectorAll('[data-delset]').forEach(el=> el.onclick = ()=> deleteSavedSet(el.dataset.delset));
  root.querySelectorAll('[data-dupset]').forEach(el=> el.onclick = ()=> duplicateSavedSet(el.dataset.dupset));
  root.querySelectorAll('[data-renset]').forEach(el=> el.onclick = ()=> renameSavedSet(el.dataset.renset));
  root.querySelectorAll('[data-expset]').forEach(el=> el.onclick = ()=> exportSetJSON(el.dataset.expset));
  const saveSetBtn = document.getElementById('saveSetBtn'); if(saveSetBtn) saveSetBtn.onclick = saveCurrentSet;
  const exportAllBtn = document.getElementById('exportAllBtn'); if(exportAllBtn) exportAllBtn.onclick = exportAllSetsJSON;
  const exportCurBtn = document.getElementById('exportCurBtn'); if(exportCurBtn) exportCurBtn.onclick = ()=> exportSetJSON(null);

  document.getElementById('addQBtn').onclick = ()=>{ window.__qFormOpen = true; window.__qEditIndex = null; renderHostSetup(); };
  document.getElementById('csvFile').onchange = (e)=>{

        window.__pendingQs = qs;
        renderHostSetup();
        toast(`นำเข้าคำถามสำเร็จ ${qs.length} ข้อ`);
      }catch(err){ toast('อ่านไฟล์ไม่สำเร็จ: '+err.message); }
    };
    reader.readAsText(f, 'UTF-8');

  if(window.__qFormOpen){
    document.getElementById('qfSaveBtn').onclick = ()=>{

      <tr>
        <td>${i+1}</td><td>${esc(q.q)}</td><td>${esc(q.choices.join(' / '))}</td><td>${letterOf(q.correct)}</td>
        <td class="qrow-actions">
          <button class="btn ghost sm" data-editq="${i}">แก้ไข</button>
          <button class="btn danger sm" data-delq="${i}">ลบ</button>
        </td>
      </tr>

    document.getElementById('qPreviewWrap').innerHTML = `
      <div style="max-height:260px;overflow:auto;margin-top:10px;">
        <table class="qprev-table"><thead><tr><th>#</th><th>คำถาม</th><th>ตัวเลือก</th><th>เฉลย</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>`;
    root.querySelectorAll('[data-editq]').forEach(el=>{
      el.onclick = ()=>{ window.__qEditIndex = parseInt(el.dataset.editq); window.__qFormOpen = true; renderHostSetup(); document.getElementById('qFormWrap').scrollIntoView({behavior:'smooth'}); };
    });
    root.querySelectorAll('[data-delq]').forEach(el=>{
      el.onclick = ()=>{
        const i = parseInt(el.dataset.delq);
        if(!confirm(`ลบคำถามข้อที่ ${i+1}?`)) return;
        window.__pendingQs.splice(i,1);

    const qTime = parseInt(document.getElementById('qTime').value)||20;

             speedRoundNext:false, speedRound:false },
      questions: window.__pendingQs,

}

function startQuestion(index){
  // Clear any auto-mode timers left over from a previous attempt at this (or
  // any other) question index — otherwise restarting/jumping to a question
  // that already had e.g. a "toReveal" timer scheduled (because everyone had
  // answered right before the restart) lets that stale timer fire against the
  // freshly-restarted question and auto-reveal it almost immediately with no
  // real answers submitted yet.
  clearAllAutoTimers();
  const useSpeed = !!(GAME && GAME.meta && GAME.meta.speedRoundNext);
  const baseQTime = (GAME && GAME.meta && (GAME.meta.baseQTime || GAME.meta.qTime)) || 20;
  const speedTimeFactor = (GAME && GAME.meta && GAME.meta.speedTimeFactor!=null) ? Number(GAME.meta.speedTimeFactor) : 0.5;
  const qTimeForThis = useSpeed ? Math.max(5, Math.round(baseQTime*speedTimeFactor)) : baseQTime;
  // One atomic multi-path update instead of 4 separate writes: with separate
  // writes, the host's own listener (and every player's) can receive the new
  // phase="question" the instant the meta write lands while the previous
  // question's answers/spins/top5 are still sitting there un-cleared, which
  // can trip the auto-mode "everyone answered" check against stale data.
  gref().update({
    'meta/phase':'question', 'meta/questionIndex':index, 'meta/phaseStartTime': Date.now(),
    'meta/paused':false, 'meta/pausedAt':null, 'meta/qTime': qTimeForThis,
    'meta/speedRound': useSpeed, 'meta/speedRoundNext':false,
    ['answers/'+index]: null,
    ['spins/'+index]: null,
    ['top5/'+index]: null,
  });
}

/* ==========================================================================
   SHARED TEACHER-CONTROL ACTIONS (used by both inline buttons and the
   floating Host Control Panel, so behaviour always matches)
   ========================================================================== */
function getTimeLeft(){
  if(!GAME || !GAME.meta) return 0;
  const t = GAME.meta.qTime;
  const start = GAME.meta.phaseStartTime || Date.now();
  const now = GAME.meta.paused ? (GAME.meta.pausedAt || Date.now()) : Date.now();
  return Math.max(0, t - (now-start)/1000);
}
function togglePause(){
  if(!GAME || !GAME.meta) return;
  if(GAME.meta.paused){
    const pausedAt = GAME.meta.pausedAt || Date.now();
    const shift = Date.now() - pausedAt;
    gref('meta').update({ paused:false, pausedAt:null, phaseStartTime:(GAME.meta.phaseStartTime||Date.now())+shift });
    toast('▶️ เล่นต่อแล้ว');
  } else {
    gref('meta').update({ paused:true, pausedAt:Date.now() });
    toast('⏸️ หยุดเกมชั่วคราว');
  }
}
function extendTime(sec){
  if(!GAME || !GAME.meta) return;
  gref('meta/phaseStartTime').set((GAME.meta.phaseStartTime||Date.now()) + sec*1000);
  toast(`⏱️ เพิ่มเวลา ${sec} วินาที`);
}
function potEmpty(){ return !!(GAME && GAME.meta && (GAME.meta.jackpot||0) <= 0); }
function afterSpinPhase(){
  // pot hit zero during the spin round -> the class just emptied the jackpot, game over
  gref('meta/phase').set(potEmpty() ? 'end' : 'leaderboard');
}
function advancePhase(){
  if(!GAME || !GAME.meta) return;
  const phase = GAME.meta.phase;
  const qi = GAME.meta.questionIndex;
  if(phase==='question') goReveal(qi);
  else if(phase==='reveal') goSpin(qi);
  else if(phase==='spin') afterSpinPhase();
  else if(phase==='leaderboard'){
    const isLast = qi >= GAME.meta.totalQuestions - 1;
    if(isLast || potEmpty()) gref('meta/phase').set('end');
    else startQuestion(qi+1);
  }
}
function jumpToQuestion(idx){
  if(!GAME || !GAME.meta) return;
  if(idx<0 || idx>=GAME.meta.totalQuestions) return;
  startQuestion(idx);
  toast(`⏭️ ไปข้อที่ ${idx+1}`);
}
function endGameNow(){ gref('meta/phase').set('end'); }
function kickPlayer(pid){
  gref('players/'+pid).remove();
  const qi = GAME && GAME.meta ? GAME.meta.questionIndex : -1;
  if(qi>=0) gref('answers/'+qi+'/'+pid).remove();
}
function adjustScore(pid, delta){
  gref('players/'+pid+'/score').transaction(v=> Math.max(0, Math.round((v||0)+delta)));
}
function setScore(pid, val){
  const n = Math.max(0, Math.round(Number(val)||0));
  gref('players/'+pid+'/score').set(n);
}
function setJackpot(val){
  const n = Math.max(0, Math.round(Number(val)||0));
  gref('meta/jackpot').set(n);
}
function adjustJackpot(delta){
  gref('meta/jackpot').transaction(v=> Math.max(0, Math.round((v||0)+delta)));
}
function toggleLock(){
  gref('meta/locked').set(!(GAME.meta.locked));
  toast(GAME.meta.locked ? '🔓 ปลดล็อคห้องแล้ว' : '🔒 ล็อคห้องแล้ว — ผู้เล่นใหม่เข้าไม่ได้');
}
function toggleReactionsEnabled(){
  const cur = GAME.meta.reactionsEnabled !== false;
  gref('meta/reactionsEnabled').set(!cur);
}

/* ==========================================================================
   AUTO MODE — lets the game run continuously without the teacher clicking
   "next" every time: question -> reveal -> spin -> leaderboard -> next
   question happens on its own, using small delays so everyone can still
   read what's on screen. The teacher can still use any manual control
   (pause, ➡️ ข้ามไปขั้นตอนถัดไป, jump, etc.) at any moment as an override —
   every scheduled auto-step re-checks the live phase/question before it
   fires, so a manual action never gets clobbered by a stale timer.
   ========================================================================== */
window.__autoTimers = window.__autoTimers || {};
function scheduleOnce(key, delayMs, fn){
  if(window.__autoTimers[key]) return; // already scheduled — don't duplicate
  window.__autoTimers[key] = setTimeout(()=>{ delete window.__autoTimers[key]; fn(); }, delayMs);
}
function clearAllAutoTimers(){
  Object.values(window.__autoTimers).forEach(id=>clearTimeout(id));
  window.__autoTimers = {};
}
function toggleAutoMode(){
  const cur = GAME.meta.autoMode !== false;
  gref('meta/autoMode').set(!cur);
  if(cur) clearAllAutoTimers();
  toast(cur? '🖐️ ปิดโหมดออโต้แล้ว — ครูกดควบคุมเองทุกขั้นตอน' : '🤖 เปิดโหมดออโต้แล้ว — เกมจะเดินหน้าให้เองอัตโนมัติ');
}

function renderHost__timerBar(){
  const t = GAME.meta.qTime;
  const left = getTimeLeft();
  const pct = left/t;
  const urgency = pct<=0.2 ? 'danger' : (pct<=0.5 ? 'warn' : '');
  const circ = 2*Math.PI*32;
  return `<div class="timer-wrap"><div class="timer-ring ${urgency}">
    <svg viewBox="0 0 74 74"><circle class="bg" cx="37" cy="37" r="32"></circle>
    <circle class="fg" cx="37" cy="37" r="32" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct)}"></circle></svg>
    <div class="num mono">${Math.ceil(left)}</div></div></div>
    ${GAME.meta.paused? `<div style="text-align:center;margin-top:-4px;margin-bottom:10px;color:var(--gold-bright);font-size:13px;">⏸️ ครูหยุดเกมชั่วคราว</div>` : ''}`;
}

let hostTickInt = null;
function renderHostGame(phase){
  clearInterval(hostTickInt);
  const qi = GAME.meta.questionIndex;
  const q = GAME.questions[qi];
  const players = GAME.players || {};
  const totalPlayers = Object.keys(players).length;
  const answers = (GAME.answers && GAME.answers[qi]) || {};
  const answeredCount = Object.keys(answers).length;
  const autoMode = GAME.meta.autoMode !== false;
  const autoNote = autoMode? `<div style="text-align:center;margin-top:10px;font-size:12px;opacity:.55;">🤖 โหมดออโต้: เกมจะเดินหน้าต่อเองอัตโนมัติ</div>` : '';

  let body = '';
  if(phase === 'question'){
    body = `
      ${renderHost__timerBar()}
      ${GAME.meta.speedRound? `<div class="speed-badge">⚡ SPEED ROUND — คะแนนคูณ ${GAME.meta.speedMult ?? 2} เท่า!</div>`:''}
      <div class="qtext">${esc(q.q)}</div>
      <div class="choices">

      </div>
      <div class="avatar-status-row">
        ${Object.entries(players).map(([id,p])=>`<div class="avatar-chip ${answers[id]?'answered':''}" title="${esc(p.name)}">${p.avatar}</div>`).join('')}
      </div>
      <div style="text-align:center;margin-top:10px;" class="answered-count">ตอบแล้ว ${answeredCount}/${totalPlayers} คน</div>
      <button class="btn block" id="nextBtn" style="margin-top:16px;">➡️ เฉลยคำตอบ</button>
      ${autoNote}
    `;
    if(autoMode && !GAME.meta.paused && totalPlayers>0 && answeredCount>=totalPlayers){
      scheduleOnce(`toReveal-${qi}`, 700, ()=>{ if(GAME && GAME.meta && GAME.meta.phase==='question' && GAME.meta.questionIndex===qi && !GAME.meta.paused) goReveal(qi); });
    }
  } else if(phase === 'reveal'){
    const counts = [0,0,0,0];
    Object.values(answers).forEach(a=>{ if(a.choice>=0 && a.choice<4) counts[a.choice]++; });
    const max = Math.max(1,...counts);
    body = `
      <div class="qtext">${esc(q.q)}</div>
      <div class="reveal-list">
        ${q.choices.map((c,i)=>`
          <div class="rbar-row">
            <span class="tag" style="width:26px;">${letterOf(i)}</span>
            <div class="rbar-track"><div class="rbar-fill ${i===q.correct?'ok':'no'}" style="width:${counts[i]/max*100}%"></div></div>
            <span class="mono" style="width:26px;text-align:right;">${counts[i]}</span>
          </div>`).join('')}
      </div>
      <div class="reveal-banner">✅ คำตอบที่ถูกคือ <b>${letterOf(q.correct)}. ${esc(q.choices[q.correct])}</b></div>
      <button class="btn block" id="nextBtn" style="margin-top:16px;">🎰 เข้าสู่ช่วงหมุนแจ็คพอท</button>
      ${autoNote}
    `;
    if(autoMode){
      scheduleOnce(`toSpin-${qi}`, 3500, ()=>{ if(GAME && GAME.meta && GAME.meta.phase==='reveal' && GAME.meta.questionIndex===qi) goSpin(qi); });
    }
  } else if(phase === 'spin'){
    const spinMap = (GAME.top5 && GAME.top5[qi]) || {};
    const spinners = Object.keys(spinMap);
    const spins = (GAME.spins && GAME.spins[qi]) || {};
    const doneCount = Object.keys(spins).length;
    body = `
      ${jackpotBadgeHTML('margin:0 auto 18px;width:220px;')}
      <div style="text-align:center;font-family:var(--disp);color:var(--gold-bright);margin-bottom:10px;">🎰 ทุกคนที่ตอบคำถามได้สิทธิ์หมุนตู้แจ็คพอท (ตอบผิด = อัตราลดลง)</div>
      <div class="top5-strip">
        ${spinners.length? spinners.map((id,i)=>{
          const p = players[id]; if(!p) return '';
          const s = spins[id];
          const wasCorrect = !!spinMap[id];
          const tag = wasCorrect ? '' : ' <span style="opacity:.6;" title="ตอบผิด — อัตราลดลง">🔻</span>';
          return `<div class="top5-chip">${p.avatar} ${esc(p.name)}${tag} ${s? `→ ${outcomeSym(s.outcome)} ${s.delta>=0?'+':''}${s.delta}`:'⏳'}</div>`;
        }).join('') : '<span style="opacity:.7;">ไม่มีใครตอบคำถามข้อนี้</span>'}
      </div>
      <div style="text-align:center;margin-top:14px;opacity:.75;font-size:13px;">หมุนแล้ว ${doneCount}/${spinners.length} คน</div>
      <button class="btn block" id="nextBtn" style="margin-top:20px;">📊 ดูตารางคะแนน</button>
      ${autoNote}
    `;
    if(autoMode){
      // safety net in case someone never spins (disconnected, etc.)
      scheduleOnce(`spinFallback-${qi}`, 12000, ()=>{ if(GAME && GAME.meta && GAME.meta.phase==='spin' && GAME.meta.questionIndex===qi) afterSpinPhase(); });
      if(spinners.length===0){
        scheduleOnce(`spinEmpty-${qi}`, 1500, ()=>{ if(GAME && GAME.meta && GAME.meta.phase==='spin' && GAME.meta.questionIndex===qi) afterSpinPhase(); });
      } else if(doneCount>=spinners.length){
        scheduleOnce(`spinDone-${qi}`, 1500, ()=>{ if(GAME && GAME.meta && GAME.meta.phase==='spin' && GAME.meta.questionIndex===qi) afterSpinPhase(); });
      }
    }
  } else if(phase === 'leaderboard'){
    const ranked = Object.entries(players).sort((a,b)=>b[1].score-a[1].score).slice(0,10);
    const isLast = qi >= GAME.meta.totalQuestions - 1;
    const gameOver = isLast || potEmpty();
    body = `
      <div style="text-align:center;font-family:var(--disp);color:var(--gold-bright);margin-bottom:14px;">📊 ตารางคะแนนล่าสุด</div>
      ${potEmpty()? `<div style="text-align:center;margin-bottom:14px;color:var(--gold-bright);">🪙 ตู้แจ็คพอทหมดแล้ว! เกมกำลังจะจบ</div>`:''}
      ${ranked.map(([id,p],i)=>`
        <div class="lb-row"><span class="lb-rank">${i+1}</span><span class="lb-av">${p.avatar}</span><span class="lb-name">${esc(p.name)}</span><span class="lb-score mono">${fmtNum(p.score)}</span></div>
      `).join('')}
      <button class="btn block" id="nextBtn" style="margin-top:18px;">${gameOver? '🏁 จบเกม ดูสรุปผล':'➡️ ข้อถัดไป'}</button>
      ${autoNote}
    `;
    if(autoMode){
      scheduleOnce(`toNext-${qi}`, 4000, ()=>{
        if(!GAME || !GAME.meta || GAME.meta.phase!=='leaderboard' || GAME.meta.questionIndex!==qi) return;
        if(isLast || potEmpty()) gref('meta/phase').set('end'); else startQuestion(qi+1);
      });
    }
  }

  root.innerHTML = `
    <div class="topbar brass-frame"><span class="rivet bl"></span><span class="rivet br"></span>
      <div class="qcount">ข้อที่ ${qi+1} / ${GAME.meta.totalQuestions}</div>
      ${jackpotBadgeHTML()}
    </div>
    ${frameWrap(`<div style="padding:22px;">${body}</div>`)}
  `;

  if(phase === 'question'){
    hostTickInt = setInterval(()=>{
      if(!GAME || !GAME.meta || GAME.meta.phase !== 'question'){ clearInterval(hostTickInt); return; }
      const left = getTimeLeft();
      if(!GAME.meta.paused && left <= 0){ clearInterval(hostTickInt); goReveal(qi); }
      else { const ring = document.querySelector('.timer-ring'); if(ring){ const circ=2*Math.PI*32; const pct=left/GAME.meta.qTime; ring.querySelector('.fg').style.strokeDashoffset = circ*(1-pct); ring.querySelector('.num').textContent = Math.ceil(left); const urgency = pct<=0.2?'danger':(pct<=0.5?'warn':''); ring.classList.remove('warn','danger'); if(urgency) ring.classList.add(urgency); } }
    }, 250);
  }

  const nb = document.getElementById('nextBtn');
  if(nb) nb.onclick = advancePhase;
}

function outcomeSym(key){ const o = OUTCOMES.find(x=>x.key===key); return o? o.sym : '❓'; }

function goReveal(qi){
  const q = GAME.questions[qi];
  const answers = (GAME.answers && GAME.answers[qi]) || {};
  const players = GAME.players || {};
  let wrongCount = 0;
  const correctList = [];
  const wrongList = [];
  Object.entries(answers).forEach(([pid,a])=>{
    if(a.choice === q.correct){ correctList.push({pid, ts:a.ts}); }
    else { wrongCount++; wrongList.push({pid, ts:a.ts}); }
  });
  correctList.sort((a,b)=>a.ts-b.ts);
  wrongList.sort((a,b)=>a.ts-b.ts);
  // everyone who answered gets to spin — correct answerers keep the normal
  // odds, wrong answerers spin too but at reduced odds (see pickOutcome).
  // Stored as {pid: true|false} where the value marks "answered correctly",
  // so the client knows which odds table to use for that player's spin.
  const spinMap = {};
  correctList.forEach(c=> spinMap[c.pid] = true);
  wrongList.forEach(c=> spinMap[c.pid] = false);

  const updates = {};
  const isSpeedRound = !!GAME.meta.speedRound;
  const speedMult = isSpeedRound ? ((GAME.meta.speedMult!=null) ? Number(GAME.meta.speedMult) : 2) : 1;
  const streakStep = (GAME.meta.streakStep!=null) ? Number(GAME.meta.streakStep) : 0.1;
  const streakCapSteps = (GAME.meta.streakCapSteps!=null) ? Number(GAME.meta.streakCapSteps) : 4;
  correctList.forEach((c,i)=>{
    const speedBonus = Math.max(0, 50 - i*10 - Math.floor(Math.random()*5));
    const cur = players[c.pid]?.score || 0;
    const streak = (players[c.pid]?.streak||0) + 1;
    const streakMult = 1 + Math.min(streak-1,streakCapSteps)*streakStep;
    const totalMult = streakMult * speedMult;
    const gain = Math.round((100 + speedBonus) * totalMult);
    updates['players/'+c.pid+'/score'] = cur + gain;
    updates['players/'+c.pid+'/streak'] = streak;
    updates['players/'+c.pid+'/lastGain'] = gain;
    updates['players/'+c.pid+'/lastMult'] = Math.round(totalMult*100)/100;
    updates['players/'+c.pid+'/lastSpeedRound'] = isSpeedRound;
    updates['players/'+c.pid+'/lastCorrect'] = true;
  });
  Object.keys(answers).forEach(pid=>{
    if(answers[pid].choice !== q.correct){
      updates['players/'+pid+'/streak'] = 0;
      updates['players/'+pid+'/lastGain'] = 0;
      updates['players/'+pid+'/lastCorrect'] = false;
    }
  });
  const refundEach = GAME.meta.wrongRefund ?? 20;
  const startPot = GAME.meta.startingJackpot || GAME.meta.jackpot || 5000;
  const potCap = Math.round(startPot*1.5);
  updates['meta/jackpot'] = Math.min(potCap, (GAME.meta.jackpot||0) + wrongCount*refundEach);
  updates['top5/'+qi] = spinMap;
  updates['meta/phase'] = 'reveal';
  gref().update(updates);
  SND.revealFanfare();
  spawnConfetti(26);
}

function goSpin(qi){ gref('meta/phase').set('spin'); }

function renderHostEnd(){
  const players = GAME.players || {};
  const ranked = Object.entries(players).sort((a,b)=>b[1].score-a[1].score);
  const spinsAll = GAME.spins || {};
  // stats
  let jackpotKing = null, jkAmt = -1;
  let unlucky = null, bombCount = -1;
  const bombTally = {};
  const potTotals = {}; // pid -> cumulative points scooped out of the shared pot across all spins
  Object.values(spinsAll).forEach(qspins=>{
    Object.entries(qspins).forEach(([pid,s])=>{
      if(s.delta > jkAmt){ jkAmt = s.delta; jackpotKing = pid; }
      if(s.outcome === 'BOMB'){ bombTally[pid] = (bombTally[pid]||0)+1; }
      if(s.delta > 0) potTotals[pid] = (potTotals[pid]||0) + s.delta;
    });
  });
  Object.entries(bombTally).forEach(([pid,c])=>{ if(c>bombCount){bombCount=c;unlucky=pid;} });
  let potRaider = null, potRaiderAmt = -1;
  Object.entries(potTotals).forEach(([pid,sum])=>{ if(sum>potRaiderAmt){potRaiderAmt=sum;potRaider=pid;} });

  root.innerHTML = `
    <div class="topbar brass-frame"><span class="rivet bl"></span><span class="rivet br"></span>
      <h2 class="disp" style="margin:0;color:var(--gold-bright);">🏁 จบเกม!</h2>
      <button class="btn ghost sm" id="csvExport">⬇️ ส่งออกคะแนน CSV</button>
    </div>
    ${frameWrap(`
      <div style="padding:22px;">
        ${potEmpty()? `<div style="text-align:center;margin-bottom:14px;color:var(--gold-bright);font-family:var(--disp);">🪙 ตู้แจ็คพอทถูกกวาดจนหมด — เกมจบลงอย่างมันส์!</div>`:''}
        <div class="podium">
          ${ranked[1]? `<div class="pod-col p2"><div class="pod-av">${ranked[1][1].avatar}</div><div class="pod-name">${esc(ranked[1][1].name)}</div><div class="pod-bar">2</div></div>`:''}
          ${ranked[0]? `<div class="pod-col p1"><div class="pod-av">👑${ranked[0][1].avatar}</div><div class="pod-name">${esc(ranked[0][1].name)}</div><div class="pod-bar">1</div></div>`:''}
          ${ranked[2]? `<div class="pod-col p3"><div class="pod-av">${ranked[2][1].avatar}</div><div class="pod-name">${esc(ranked[2][1].name)}</div><div class="pod-bar">3</div></div>`:''}
        </div>
        <div class="stat-grid">
          <div class="stat-card"><div class="ic">🪙</div><div class="lbl">เจ้าแม่/เจ้าพ่อตู้แจ็คพอท</div><div class="val">${potRaider? esc(players[potRaider].name)+' (+'+fmtNum(potRaiderAmt)+')':'-'}</div></div>
          <div class="stat-card"><div class="ic">💎</div><div class="lbl">หมุนแตกครั้งใหญ่สุด</div><div class="val">${jackpotKing? esc(players[jackpotKing].name)+' (+'+fmtNum(jkAmt)+')':'-'}</div></div>
          <div class="stat-card"><div class="ic">💣</div><div class="lbl">โดนระเบิดบ่อยสุด</div><div class="val">${unlucky? esc(players[unlucky].name)+' ('+bombCount+' ครั้ง)':'-'}</div></div>
        </div>
        <div style="margin-top:24px;">
          ${ranked.map(([id,p],i)=>`<div class="lb-row"><span class="lb-rank">${i+1}</span><span class="lb-av">${p.avatar}</span><span class="lb-name">${esc(p.name)}</span><span class="lb-score mono">${fmtNum(p.score)}</span></div>`).join('')}
        </div>
        <button class="btn danger block" id="newGameBtn" style="margin-top:20px;">♻️ เริ่มเกมใหม่</button>
      </div>
    `)}
  `;
  document.getElementById('newGameBtn').onclick = ()=>{ if(confirm('เริ่มเกมใหม่ทั้งหมด?')){ clearAllAutoTimers(); gref().set(null); } };
  document.getElementById('csvExport').onclick = ()=>{
    let csv = "\uFEFFอันดับ,ชื่อ,คะแนน\n";
    ranked.forEach(([id,p],i)=>{ csv += `${i+1},${p.name},${p.score}\n`; });
    const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='คะแนน-jackpot-quiz.csv'; a.click();
  };
}
</script>

<script>
/* ==========================================================================
   HOST CONTROL PANEL — floating "cockpit" for the teacher.
   Mounted to <body> (not #app) so it survives every re-render of the game
   view untouched; only its own innerHTML is refreshed on each GAME update.
   ========================================================================== */
window.__cpOpen = false;
window.__cpTab = 'players';

function removeHostControlPanel(){
  const el = document.getElementById('hostCP');
  if(el) el.remove();
}

function mountHostControlPanel(){
  if(!GAME || !GAME.meta || GAME.meta.phase === 'setup'){ removeHostControlPanel(); return; }
  let panel = document.getElementById('hostCP');
  if(!panel){ panel = document.createElement('div'); panel.id = 'hostCP'; document.body.appendChild(panel); }
  panel.innerHTML = cpTemplate();
  wireControlPanel();
}

function cpTemplate(){
  const paused = !!GAME.meta.paused;
  const phase = GAME.meta.phase;
  return `

/* ---- rate/odds editor: lets the teacher change the weight of each
   jackpot-reel outcome and see the live % chance + how many items total
   can be drawn. ---- */
function cpRatesSection(){
  const list = effectiveOutcomes();
  const total = list.reduce((s,o)=>s+o.weight,0) || 1;
  const activeCount = list.filter(o=>o.weight>0).length;
  return `
    <div class="cp-sec">
      <div class="cp-sec-title">🎯 อัตราการออกรางวัล (น้ำหนักสุ่ม)</div>
      <div class="cp-note">ตัวเลขยิ่งมาก โอกาสออกยิ่งสูง — ใส่ 0 เพื่อปิดรายการนั้นไม่ให้ออก ระบบคำนวณ % ให้อัตโนมัติ</div>
      <div class="rate-editor" id="rateEditor">
        ${list.map(o=>`
          <div class="rate-row">
            <span class="rate-sym">${o.sym}</span>
            <span class="rate-label">${o.label}</span>
            <input class="rate-input mono" type="number" min="0" step="1" inputmode="numeric" value="${o.weight}" data-key="${o.key}">
            <span class="rate-pct mono" data-pct="${o.key}">${(o.weight/total*100).toFixed(1)}%</span>
          </div>
        `).join('')}
      </div>
      <div class="rate-total-note">🎰 รายการที่สุ่มได้ทั้งหมด: <b>${list.length}</b> รายการ (เปิดใช้งานอยู่ ${activeCount} รายการ)</div>
      <div class="cp-row" style="margin-top:8px;">
        <button class="btn ghost sm block" id="cpResetRatesBtn">↺ คืนค่าอัตราเริ่มต้น</button>
      </div>
    </div>
  `;
}
function recalcRatePercents(){
  const editor = document.getElementById('rateEditor');
  if(!editor) return;
  const inputs = editor.querySelectorAll('.rate-input');
  let total = 0;
  inputs.forEach(el=>{ total += Math.max(0, Number(el.value)||0); });
  if(total<=0) total = 1;
  inputs.forEach(el=>{
    const w = Math.max(0, Number(el.value)||0);
    const pctEl = editor.querySelector(`.rate-pct[data-pct="${el.dataset.key}"]`);
    if(pctEl) pctEl.textContent = (w/total*100).toFixed(1)+'%';
  });
}
